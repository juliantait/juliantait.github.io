<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    Mockup of a Windows desktop showing the shortcut the oTree LabLauncher
    Windows helper auto-creates on the desktop. Rendered to a PNG with headless
    Chromium (see win-desktop-shortcut.png). Re-render by screenshotting the
    .desktop element at 900x600.
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 900px;
      height: 600px;
      overflow: hidden;
      font-family: "Segoe UI", "Segoe UI Variable", Tahoma, Arial, sans-serif;
    }

    /* A simple Windows-style wallpaper: a calm blue gradient. */
    .desktop {
      position: relative;
      width: 900px;
      height: 600px;
      background: linear-gradient(135deg, #1b3a63 0%, #2a5f9e 45%, #4a86c5 100%);
      overflow: hidden;
    }

    /* The single desktop shortcut, placed prominently near the top-left the way
       Windows drops a newly created shortcut. */
    .shortcut {
      position: absolute;
      top: 70px;
      left: 90px;
      width: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: default;
      user-select: none;
    }

    .icon-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.35));
    }

    .icon-wrap img {
      width: 96px;
      height: 96px;
      object-fit: contain;
    }

    /* The small shortcut-arrow badge Windows overlays in the lower-left corner. */
    .shortcut-badge {
      position: absolute;
      left: -2px;
      bottom: -2px;
      width: 30px;
      height: 30px;
      background: #ffffff;
      border: 1px solid #c9c9c9;
      border-radius: 3px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shortcut-badge svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .shortcut-label {
      margin-top: 8px;
      color: #ffffff;
      font-size: 14px;
      line-height: 1.25;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.7);
    }

    /* A thin taskbar pinned to the bottom. */
    .taskbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 44px;
      background: rgba(20, 26, 36, 0.92);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      backdrop-filter: blur(6px);
    }

    .start-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 32px;
      border-radius: 4px;
    }

    .start-button:hover { background: rgba(255, 255, 255, 0.08); }

    /* Windows four-pane logo. */
    .start-logo {
      display: grid;
      grid-template-columns: 9px 9px;
      grid-template-rows: 9px 9px;
      gap: 3px;
    }
    .start-logo span { background: #4aa3ff; border-radius: 1px; }

    .clock {
      color: #eaeef5;
      font-size: 12px;
      line-height: 1.3;
      text-align: right;
      padding-right: 4px;
    }
    .clock .time { font-weight: 600; }
    .clock .date { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="desktop">
    <div class="shortcut">
      <div class="icon-wrap">
        <img src="lablauncher-logo.png" alt="oTree LabLauncher icon" />
        <div class="shortcut-badge" aria-hidden="true">
          <!-- Classic bent shortcut arrow. -->
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 15 V8 a1 1 0 0 1 1-1 h6" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" fill="none"/>
            <path d="M9 4 L14 7 L9 10 Z" fill="#1a1a1a"/>
          </svg>
        </div>
      </div>
      <div class="shortcut-label">Start oTree LabLauncher</div>
    </div>

    <div class="taskbar">
      <div class="start-button" aria-label="Start">
        <div class="start-logo">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="clock">
        <div class="time">09:41</div>
        <div class="date">25/09/2026</div>
      </div>
    </div>
  </div>
</body>
</html>
