                                                    further padding buys nothing)
         logo marks 32px -&gt; 24px ......................... +8px
         panel padding 14px -&gt; 10px ...................... +8px
         ------------------------------------------------------------------
         realistically available in total ................ ~32px
         cost of ONE more line of consent copy ........... ~31px

       SO THE FOLD ABSORBS ABOUT ONE EXTRA LINE, and then it is out. Two things
       follow. Do NOT set the inter-option gap to 0 to find another 6px: the two
       options would touch and read as one block, which is the last thing a
       consent choice may do. And when the budget runs out, STOP TIGHTENING —
       shorten the copy, or accept that the card scrolls. The scroll affordance
       is real and is asserted (conditionally, both ways, in
       scripts/tests/render_check.py), and the guarantee that actually stops somebody
       consenting blind is elsewhere: the radio ships un-pre-checked and an
       untouched submit is REJECTED. The fold is a courtesy, not the control. */
    .stacked-form .mc-option,
    .stacked-form .form-check { padding-block: .5em; }
    .stacked-form .mc-option + .mc-option,
    .stacked-form .form-check + .form-check { margin-top: 6px; }
    /* AND THE STRIP YIELDS — both levers, deliberately, not whichever one
       reached the number first (Julian, 2026-08-13). It gets the phone
       breakpoint&#x27;s smaller marks for the same reason it gets them on a narrow
       screen, and the reason is a PRIORITY, not a pixel count: the logo strip is
       EXTRA and must not take precedence over important features, so on a short
       screen it gives way before participant-facing content does. The full
       statement is at THE LOGO FOOTER RULE above; if vertical space is ever
       short again, this strip is the first thing that should shrink. The RULE
       itself (placement, order, divider) is untouched — only the mark height. */
    /* THE BOX SHRINKS AS A BOX, keeping its 7:1 ratio (32px x 224px), so a
       mark that fits on a laptop fits here too. Retuning the token rather
       than the img rule keeps ONE definition of the box — see THE LOGO BOX.
       224px is what the widest shipped mark needs at 32px (220.9px). */
    :root { --logo-box-h: 32px; --logo-box-w: 224px; }
}

/* --- respect reduced-motion preference -------------------------------------- */
@media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
}

/* ============================================================================
   DESIGN SYSTEM — shared components
   ----------------------------------------------------------------------------
   CASCADE PRINCIPLE: the rules that make screens consistent live HERE, centrally.
   A page may override them, but only as a deliberate rule in that page&#x27;s own CSS
   carrying an &quot;EXCEPTION:&quot; comment that says why (e.g. an EXCEPTION comment on the
   task screen that lifts the chart cap), never by quietly duplicating a value. If
   you find yourself copying a rule, move it here instead. Read this file
   top-to-bottom before adding a page override.
   ============================================================================ */

/* --- three-section card anatomy ---------------------------------------------
   Every screen card is one of three stacked regions, in this order:
     .experimental-header  — title + intro line (top)
     .experimental-content — the substance, vertically centred, grows to fill
     .button-row           — the single forward action, centred at the FOOT
   These already exist above; the aliases below let a card name its regions
   explicitly when the semantic classes don&#x27;t fit. Same flex behaviour. */
.card-top    { display: flex; flex-direction: column; gap: 12px; }
.card-body   { flex: 1 1 auto; display: flex; flex-direction: column;
               gap: 16px; justify-content: center; }
.card-foot   { margin-top: auto; padding-top: 24px; }

/* --- mc-option: the shared multiple-choice option card ----------------------
   ONE component for every single-choice answer in the study — the comprehension
   quiz answers AND the welcome-page consent options both render as these, so
   they look and behave identically. A full-width selectable card wrapping one
   radio/checkbox.

   NAMING. `.mc-option` is the canonical class; use it in any hand-authored
   choice markup. oTree&#x27;s formfield helper emits Bootstrap `.form-check` markup
   that we CANNOT add a class to, so `.form-check` is aliased to the same rules
   here — treat the two as the same component. Without this alias every
   oTree-rendered radio in the study (consent, quiz, agreement) falls back to a
   bare unstyled Bootstrap control.

   GAP. Options in a group are separated by --mc-gap via an adjacent-sibling
   margin, so adjacent cards never touch WHATEVER container oTree wraps them in.
   Reuse this component for future MC questions and the gap comes for free.

   Markup (hand-authored):
     &lt;div class=&quot;mc-options&quot;&gt;
       &lt;label class=&quot;mc-option&quot;&gt;
         &lt;input type=&quot;radio&quot; name=&quot;q1&quot; value=&quot;a&quot;&gt;
         &lt;span class=&quot;mc-option-body&quot;&gt;Option A text&lt;/span&gt;
       &lt;/label&gt;
     &lt;/div&gt;
   Markup (oTree): {{ formfield &#x27;field&#x27; }} with widget=widgets.RadioSelect —
   nothing to do, the alias picks it up. */
.mc-options {
    display: flex;
    flex-direction: column;
    gap: var(--mc-gap);
    width: 100%;
    max-width: 560px;   /* a control band, NOT the reading measure */
    margin-inline: auto;
}

.mc-option, .form-check {
    display: flex;
    align-items: center;
    gap: .7em;
    margin: 0;
    /* symmetric internal padding: top/bottom equal to the sides */
    padding: .85em;
    /* comfortable touch target: guarantee &gt;=44px tall even at small font scales
       (Apple/WCAG minimum). Content stays vertically centred via align-items. */
    min-height: 44px;
    /* positioning context for the label hit-area overlay (see below) */
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    cursor: pointer;
    transition: border-color .14s ease, background-color .14s ease, box-shadow .14s ease;
}
/* separate stacked options in the same group (works in any oTree wrapper) */
.mc-option + .mc-option, .form-check + .form-check { margin-top: var(--mc-gap); }

.mc-option:hover, .form-check:hover { border-color: var(--accent); background: var(--accent-soft); }

/* Selected state (no JS). */
.mc-option--selected,
.mc-option:has(input:checked),
.form-check:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
    box-shadow: 0 0 0 1px var(--accent);
}

/* Hand-rolled radio/checkbox, so the control looks the same on every browser. */
.mc-option input[type=&quot;radio&quot;],
.mc-option input[type=&quot;checkbox&quot;],
.form-check input[type=&quot;radio&quot;],
.form-check input[type=&quot;checkbox&quot;] {
    appearance: none;
    -webkit-appearance: none;
    flex: 0 0 auto;
    width: 1.15em;
    height: 1.15em;
    margin: 0;
    border: 2px solid var(--line-strong);
    border-radius: 50%;
    background: var(--card-bg);
    cursor: pointer;
    transition: border-color .14s ease, box-shadow .14s ease;
}
.mc-option input[type=&quot;checkbox&quot;], .form-check input[type=&quot;checkbox&quot;] { border-radius: 5px; }
.mc-option input:checked, .form-check input:checked {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 4px var(--accent);
}

.mc-option label, .mc-option .form-check-label, .mc-option-body,
.form-check label, .form-check .form-check-label {
    margin: 0;
    cursor: pointer;
    flex: 1;
    color: var(--ink);
}

/* FULL-CARD HIT AREA. INTENTION: oTree emits each option as a .form-check DIV
   holding an &lt;input&gt; and a bound &lt;label&gt;, and we style that DIV as a padded,
   pointer-cursor card — so it LOOKS entirely clickable, but only the input and
   the label element actually toggle the choice; the padding and card edges are
   dead space. On touch that reads as lag (the first tap misses). We cannot add
   JS or change the emitted markup, so the BOUND LABEL grows a transparent
   pseudo-element covering the whole card (inset:0): a tap ANYWHERE on the card —
   padding, far edge, corner — now lands on the label and selects the option.
   The overlay MUST sit on the label, not on the card: a ::after on the card
   itself intercepts the click instead of forwarding it. The input is lifted
   above the overlay so the radio dot stays directly clickable and keyboard
   tab/space are unaffected. */
.mc-option label::after,
.mc-option .form-check-label::after,
.mc-option .mc-option-body::after,
.form-check label::after,
.form-check .form-check-label::after {
    content: &quot;&quot;;
    position: absolute;
    inset: 0;
    cursor: pointer;
}
.mc-option input, .form-check input { position: relative; z-index: 1; }

/* Keyboard focus: a visible ring on the whole card when the control is focused,
   so tab focus is obvious. Sits after :has(input:checked) so a focused option
   reads clearly. */
.mc-option:focus-within, .form-check:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
}

/* --- mc-scale: the horizontal variant --------------------------------------
   ESCAPE HATCH for a many-point rating scale (a 0–10 Likert / Dohmen risk item).
   Because .form-check above is a full-width card, an 11-point
   RadioSelectHorizontal would otherwise render as ELEVEN stacked giant cards.
   Wrap such a field in .mc-scale and the options become compact side-by-side
   cells instead. oTree emits .form-check.form-check-inline for horizontal
   widgets, so both selectors are covered.

   Markup:
     &lt;div class=&quot;mc-scale&quot;&gt;{{ formfield &#x27;risk_item&#x27; }}&lt;/div&gt; */
.mc-scale .controls,
.mc-scale &gt; div {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: flex-start;
}
.mc-scale .form-check,
.mc-scale .form-check-inline {
    flex: 1 1 auto;
    min-width: 2.6em;
    flex-direction: column;
    align-items: center;
    gap: .35em;
    padding: .5em .35em;
    min-height: 0;
    text-align: center;
}
/* the stacked-card gap rule above must not apply to a horizontal row */
.mc-scale .form-check + .form-check { margin-top: 0; }
.mc-scale .form-check label,
.mc-scale .form-check .form-check-label { flex: 0 0 auto; text-align: center; }

/* --- anchored popover -------------------------------------------------------
   A small help panel anchored to a trigger (e.g. a &quot;?&quot;), shown on hover/focus.
   CSS-only; the panel is positioned relative to .popover-anchor and reserves no
   layout space (absolute), so it never shifts the page.

   Markup:
     &lt;span class=&quot;popover-anchor&quot; tabindex=&quot;0&quot;&gt;?
       &lt;span class=&quot;popover-panel&quot; role=&quot;tooltip&quot;&gt;Explanatory text…&lt;/span&gt;
     &lt;/span&gt;
*/
.popover-anchor {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.4em;
    height: 1.4em;
    border-radius: 50%;
    border: 1px solid var(--color-border);
    color: var(--color-primary);
    font-size: 0.8em;
    cursor: help;
    user-select: none;
}
.popover-panel {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: 280px;
    padding: 10px 12px;
    background: var(--color-heading);
    color: #fff;
    font-size: 14px;
    line-height: 1.4;
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
    text-align: left;
    opacity: 0;
    visibility: hidden;             /* reserve nothing; no page shift */
    transition: opacity 0.12s ease;
    z-index: 50;
}
.popover-panel::after {            /* little arrow */
    content: &quot;&quot;;
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: var(--color-heading);
}
.popover-anchor:hover .popover-panel,
.popover-anchor:focus .popover-panel,
.popover-anchor:focus-within .popover-panel {
    opacity: 1;
    visibility: visible;
}

/* --- COMPONENT: the scroll cue, a wide low pulsing V --------------------------
   THE FOURTH LAYER of the scroll affordance (change_requests item 4, Julian
   2026-08-11), and it JOINS the other three rather than replacing any of them:
   the styled scrollbar, the CSS-only edge shadow and the content fade all stay.
   Julian&#x27;s rule: anything that makes it obvious there is more text below is
   worth having.

   DRAWN, NOT TYPED. Two rounded bars, one per arm — no glyph, so it cannot come
   out as a tofu box in a font that lacks a chevron (that is what happened to the
   results page&#x27;s ▸). Bars rather than the usual rotated-square-with-two-borders
   trick because that trick CANNOT make this shape: flattening a rotated square
   enough to be wide and low also squashes its borders, and the V comes out as a
   hairline (measured 2026-08-11 — Julian&#x27;s &quot;too small and too thin&quot;). Two
   explicit bars keep a constant 4px stroke at any width and any shallowness.
   Geometry: 96px wide, 16px tall — wide and low, as asked.

   WHERE IT IS DRAWN, and why NOT inside the scroll region: the region carries
   the content fade as a CSS MASK, and a mask fades EVERYTHING the element
   paints, so a cue drawn there would be faded away exactly where it is needed.
   It is therefore drawn on the element that FOLLOWS the scroller.

   IT MUST NEVER LAND ON A LINE OF TEXT (fixed 2026-08-11 after Julian saw it
   painted across the results page&#x27;s &quot;Total €79.50&quot; row, which reads as a
   rendering fault, not as a cue). Its own strip is the ALWAYS-EMPTY band around
   the top edge of that following element: the card&#x27;s flex gap above the edge
   (&gt;=16px) and the row&#x27;s own padding-top below it (&gt;=14px on the shortest
   viewport; .instruction-controls carries a matching padding-top for the same
   reason). `bottom: 100%` + `translateY(50%)` centres each bar&#x27;s box exactly on
   that edge, so the V spans edge-8px .. edge+8px and both halves are in
   reserved whitespace. It is measured off the rendered pixels in
   scripts/tests/render_check.py: with the cue suppressed, its band must be blank card.

   NO CUE ON A CARD WITH NO BUTTON ROW (the lab results page). The only band
   available there is the logo strip&#x27;s top rule, and a V drawn across a
   horizontal rule looks like the very glitch this rule exists to avoid; those
   pages keep the other three layers.

   It is bound to the .is-scrollable-down class global.js already maintains, so
   it appears only while there is more below and disappears at the end of the
   scroll. No JavaScript of its own; with scripts blocked no class is ever set
   and the other three layers carry the affordance alone. The pulse sits under
   the file&#x27;s global prefers-reduced-motion rule, which kills every animation. */
.experimental-content.is-scrollable-down ~ .button-row,
.instruction-wrapper.is-scrollable-down ~ .instruction-controls {
    position: relative;
}

.experimental-content.is-scrollable-down ~ .button-row::before,
.experimental-content.is-scrollable-down ~ .button-row::after,
.instruction-wrapper.is-scrollable-down ~ .instruction-controls::before,
.instruction-wrapper.is-scrollable-down ~ .instruction-controls::after {
    content: &quot;&quot;;
    position: absolute;
    bottom: 100%;
    left: 50%;
    width: 51px;                 /* arm length: hypotenuse of 48 x 16 */
    height: 4px;                 /* constant stroke, whatever the shape */
    border-radius: 999px;
    background: var(--ink-mute);
    pointer-events: none;        /* never intercept a click meant for a button */
    animation: scroll-cue-pulse 2.6s ease-in-out infinite;
}

/* left arm: down-right; right arm: down-left. They meet on the centre line,
   8px below the edge, with their outer ends 8px above it. */
.experimental-content.is-scrollable-down ~ .button-row::before,
.instruction-wrapper.is-scrollable-down ~ .instruction-controls::before {
    margin-left: -50px;
    transform: translateY(50%) rotate(18.4deg);
}

.experimental-content.is-scrollable-down ~ .button-row::after,
.instruction-wrapper.is-scrollable-down ~ .instruction-controls::after {
    margin-left: -1px;
    transform: translateY(50%) rotate(-18.4deg);
}

@keyframes scroll-cue-pulse {
    0%, 100% { opacity: .30; }
    50%      { opacity: .95; }
}

/* --- COMPONENT: round-of-total progress strip --------------------------------
   The task screens&#x27; one progress indicator (change_requests item 7): a text
   line above a slim bar, both fed by the SAME server-side numbers
   (main.progress_vars), so they cannot disagree. Ported from the reference
   build&#x27;s task screen and simplified to &quot;Round X of Y&quot; — this template has no
   blocks/parts. Lives here, not in a page stylesheet, because any page that
   needs to say where the participant is should use this one component. */
.progress-strip { display: flex; flex-direction: column; gap: 10px; width: 100%; }

.progress-count {
    font-size: clamp(17px, 1.5vw, 20px);
    font-weight: 650;
    color: var(--ink);
    letter-spacing: -.01em;
}

.progress-track {
    height: 5px;
    border-radius: 999px;
    background: var(--line);
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
    transition: width .3s ease;
}

/* ===========================================================================
   THE NOTIFICATION TIER LADDER — the study&#x27;s four ways of putting something in
   front of a participant, numbered 0–3 by how far OUTSIDE the experiment frame
   the message sits. ONE place, so a new pop-up is a CHOICE BETWEEN FOUR
   DOCUMENTED BEHAVIOURS rather than a fresh invention with its own z-index and
   its own idea of how to be dismissed (Julian, 2026-08-17; brief in
   _ai/template_adoption_brief.md, Topic A — local only, _ai/ is gitignored).

   The tier decides BEHAVIOUR (backdrop? how is it dismissed? can it move the
   page layout?); the component keeps its own SKIN. Apply as
   `class=&quot;popup popup--&lt;tier&gt;&quot;`, plus the component&#x27;s own skin class.

     popup--anchored  (tier 0) NO backdrop. A small panel floated beside the
                      control that opened it, absolute and out of flow, so
                      opening it can never push the page down. Dismissed by an
                      outside click or Escape. The page underneath stays usable.

     popup--toast     (tier 1) NO backdrop, NOT dismissible by hand, absolutely
                      positioned so it can never move layout, and it CLEARS
                      ITSELF after a few seconds (or when the action completes).
                      Julian calls this the SIDETONE. Announced politely
                      (role=&quot;status&quot;) so a screen reader hears it without focus
                      being stolen.

     popup--modal     (tier 2) DIMMED BACKDROP, EXPLICIT DISMISSAL: it blocks
                      the page until the participant acts. Escape-dismissible BY
                      DEFAULT; a modal that must be ACKNOWLEDGED opts in to
                      button-only dismissal with `popup--acknowledge`. It KEEPS
                      THE STUDY&#x27;S VISUAL LANGUAGE — the card radius, the lift
                      shadow, the shared button — because it is still the study
                      talking, not the browser. IMPLEMENTED BY the warning-modal
                      component below (.modal-backdrop / .modal-card); popup--modal
                      is its ladder name, one rule block, not a second modal.

     popup--takeover  (tier 3) FULL-BLEED and BLURRED, opaque backdrop, NO
                      DISMISSAL AT ALL — it clears only when the blocking
                      CONDITION clears, never by a button. The study has stopped
                      and the participant cannot carry on from here. IMPLEMENTED
                      BY .tabmon-overlay (tabmonitor.css, the red away-overlay),
                      which predates this ladder; popup--takeover is its alias
                      there, so tier 3 is catalogued, not rebuilt.

   HOW A TIER IS CHOSEN AT THE CALL SITE — the one-line test:
     in flow beside a control            → anchored
     a fading acknowledgement of an act  → toast
     must be decided before continuing   → modal
     the study has stopped               → takeover
   A takeover NEVER has a close control; if you need a button, it is a modal.
   Copy is study-specific and passed in the markup (counts/prizes/rounds come
   from config, per the no-hardcoded-quantities rule); the toast timeout is the
   one allowed literal, an interaction timing, exposed as data-popup-timeout.

   The BEHAVIOUR (open/close, ARIA, keyboard, focus trap, auto-dismiss) lives in
   ONE place — global.js&#x27;s &quot;POPUP LADDER&quot; block — keyed off these classes and
   data-popup-* attributes, so a study author writes MARKUP ONLY. Specimens of
   all four are in _static/global/html/template.html (CARD 3). Tiers 2 and 3
   already had live instances when the ladder landed; those keep their own JS
   (the warning modal, the quiz dialogs, the tab monitor) and are brought in by
   NAME + the shared focus trap, not rewired — the tab-switch warning modal in
   particular is left on its own tabmonitor chrome on purpose (it owns the
   disqualification route; see DECISIONS.md).
   =========================================================================== */

/* Every popup sits above the page and never inherits the surrounding text
   alignment. Nothing here positions anything — each tier does that itself,
   because &quot;does this take part in layout&quot; is exactly what separates them. */
.popup { text-align: left; }
.popup[hidden] { display: none; }

/* --- TIER 0: ANCHORED --------------------------------------------------------
   INTENTION (lifted verbatim from the TODO entry that commissioned it): tier 0
   is for something the participant ASKED FOR BY CLICKING — an explainer beside a
   figure or a label, the meaning of a term, a reminder of the exchange rate or
   of how the bonus is worked out; content that does not interrupt, does not
   require a decision, and can be dismissed by looking away. What does NOT belong
   here: anything the study needs the participant to acknowledge, anything that
   reports a rule being broken, anything time-critical.

   Distinct from .popover-anchor / .popover-panel above: THAT is a CSS-only
   hover/focus tooltip (role=&quot;tooltip&quot;), shown while hovered and gone when not.
   THIS is CLICK-to-open and stays open until dismissed (role=&quot;dialog&quot;), which is
   why it needs the JS in global.js. Use the popover for a passive hint, tier 0
   for something the participant deliberately opened.

   The trigger is wrapped in .popup-anchor (position: relative) and the panel is
   absolute under it, so opening the panel never pushes the page down. */
.popup-anchor { position: relative; display: inline-flex; }

.popup-trigger {
    appearance: none;
    -webkit-appearance: none;
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: var(--card-bg);
    color: var(--ink-mute);
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    transition: border-color .14s ease, color .14s ease, background-color .14s ease;
}
.popup-trigger:hover,
.popup-trigger[aria-expanded=&quot;true&quot;] {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
}

.popup--anchored {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 40;
    width: min(320px, 78vw);
    padding: 12px 14px;
    background: var(--card-bg);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-lift);
    font-size: .84em;
    line-height: 1.5;
    color: var(--ink-soft);
}
.popup--anchored p { margin: 0; }
.popup--anchored p + p { margin-top: .6em; }

/* --- TIER 1: TOAST (the sidetone) --------------------------------------------
   CANNOT MOVE THE LAYOUT — that is the whole contract. Absolutely positioned
   inside its host (which must be position: relative — use .popup-toast-host, or
   any relatively-positioned wrapper), so it is out of flow in every state and
   appearing or clearing shifts nothing. Centred over the control it is talking
   about, and pointer-transparent so it can never swallow the click the
   participant makes next. It auto-clears on a timer (global.js, default 4000ms,
   overridable with data-popup-timeout) — never dismissed by hand. */
.popup-toast-host { position: relative; }

.popup--toast {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 60;
    max-width: min(320px, 92%);
    padding: .6em 1em;
    background: var(--ink);
    color: #fff;
    border-radius: var(--r-md);
    box-shadow: var(--shadow-lift);
    font-size: .84em;
    line-height: 1.4;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity .16s ease;
}
.popup--toast strong { color: #fff; }
.popup--toast.is-visible { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
    .popup--toast { transition: none; }
}

/* --- COMPONENT: warning modal  (TIER 2 of the ladder above) ------------------
   ALL WARNINGS ARE CENTRED, SCREEN-DIMMING MODALS (change_requests item 9,
   Julian 2026-08-11) — never a banner that pushes the page down under the
   participant. These rules used to live in quiz.css and serve the lab&#x27;s
   quiz-failure dialogs only; they are the shared component now, and
   global.js&#x27;s warning-modal helper builds oTree&#x27;s validation errors into
   exactly this chrome on every page. An overlay, so revealing it moves nothing
   underneath (the stability rule).

   THIS IS TIER 2 (popup--modal) OF THE LADDER. `.popup--modal` is the ladder
   name for exactly this backdrop; the two selectors share one rule block below
   so there is one implementation, not two. A page adds `popup popup--modal` to
   the backdrop and `.modal-card` (+ optional `popup--acknowledge` for button-only
   dismissal) and gets the tier&#x27;s behaviour from global.js.

   DELIBERATELY NOT SHARED: the tab monitor&#x27;s full-screen red overlay
   (tabmonitor.css). That is tier 3 (an ENFORCEMENT takeover covering the whole
   viewport on purpose), not a validation message, and Julian confirmed it stays
   as it is.

   [hidden] must win over the flex display. */
.popup--modal,
.modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(16, 32, 52, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.popup--modal[hidden],
.modal-backdrop[hidden] { display: none; }

.modal-card {
    background: var(--card-bg);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lift);
    max-width: 34rem;
    width: 100%;
    padding: 28px 32px;
    text-align: center;
}

.modal-title {
    color: var(--ink);
    margin: 0 0 12px;
    font-size: 1.15em;
    font-weight: 680;
}

/* A validation failure is the one modal that reads as an error, so its title
   takes the danger ink (the reference build does the same). */
.modal-card--warning .modal-title { color: var(--danger); }

.modal-text {
    margin: 0 0 20px;
    color: var(--ink-soft);
    line-height: 1.5;
}

.modal-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    align-items: center;
}

/* Secondary (dismiss) action: quieter than the primary, but clearly a real
   control — not the dashed debug styling. Matches the shared .ghost button so
   the modal&#x27;s two actions read as one pair.
   NB: deliberately NOT .next-button — global.js&#x27;s Enter handler targets the
   first .next-button, and dismissing must never steal Enter from a page&#x27;s own
   submit while the modal is closed. */
.modal-dismiss-button {
    appearance: none;
    -webkit-appearance: none;
    display: inline-block;
    font: inherit;
    font-weight: 620;
    line-height: 1;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--ink-soft);
    padding: 0.85em 2em;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color .16s ease, border-color .16s ease, color .16s ease;
}

.modal-dismiss-button:hover {
    background: var(--sunken);
    border-color: var(--line-strong);
    color: var(--ink);
}

/* The warning modal&#x27;s single OK: it looks primary, but it is NOT .next-button —
   see the note above. While the modal is open global.js disables the page&#x27;s own
   submits, so Enter reaches the modal&#x27;s own handler and dismisses it. */
.modal-ok-button {
    appearance: none;
    -webkit-appearance: none;
    display: inline-block;
    font: inherit;
    font-weight: 620;
    line-height: 1;
    color: #fff;
    background: var(--accent);
    border: 1px solid transparent;
    padding: 0.85em 2em;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(16, 32, 52, .12);
    transition: background-color .16s ease;
}

.modal-ok-button:hover { background: var(--accent-hover); }

/* (The old rule that lived here — &quot;a logo strip that is a direct child of the
   card, the results page only&quot; — is gone: being a direct child of the card is
   now THE arrangement on every page, not the results page&#x27;s exception. See THE
   LOGO FOOTER RULE near the top of this file, which carries the flex, the
   order and the bottom-edge push in one place.) */

/* Pilot feedback textarea: a control, so it keeps the full card width (never
   clamped to the reading measure). */
.feedback-textarea {
    width: 100%;
    font: inherit;
    color: var(--color-text);
    background: var(--color-background);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 12px 14px;
    resize: vertical;
}

&lt;/style&gt;
&lt;style&gt;
/* OPERATOR SCREEN. base.css supplies the tokens (colours, radii, shadow) so
   this looks like the study&#x27;s control room, not a debug page — but density
   and across-the-room legibility outrank the participant pages&#x27; whitespace. */
body { padding: 18px 22px; font-size: 15px; line-height: 1.35; }
.dash-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  margin-bottom: 10px; }
.dash-top h1 { font-size: 1.15rem; margin: 0; }
.dash-top .session-code { color: var(--ink-mute); font-size: .9rem; }
.dash-counts { color: var(--ink-soft); font-size: .9rem; }
.dash-status { margin-left: auto; font-size: .85rem; color: var(--ink-mute); }
.dash-status.err { color: var(--danger); font-weight: 650; }
.dash-controls { font-size: .85rem; color: var(--ink-soft); user-select: none; }

table.dash { width: 100%; border-collapse: collapse; background: var(--card-bg);
  border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden;
  box-shadow: var(--shadow); }
table.dash th { text-align: left; font-size: .78rem; text-transform: uppercase;
  letter-spacing: .04em; color: var(--ink-mute); background: var(--sunken);
  padding: 7px 10px; border-bottom: 1px solid var(--line-strong); }
table.dash td { padding: 6px 10px; border-bottom: 1px solid var(--line);
  vertical-align: middle; }
table.dash tr:last-child td { border-bottom: none; }

tr.entry-only td { opacity: .45; }        /* de-emphasised, still there */
/* AMBER ROW TINT: KEPT alongside the yellow timing pill, deliberately (the
   pills change, 2026-08-13). The two are complementary, not duplicate: the
   tint is the across-the-room salience — what makes a stalled row findable in
   a 20-row table without reading it — and the pill carries the FACTS (which
   phase, how long). Dropping the tint would leave a small pill in the last
   column as the only signal; dropping the pill would restore &quot;something is
   slow&quot; with no what-or-how-much. If the pair ever reads as noisy on a real
   lab monitor, the tint is the one to drop — the pill holds the information. */
tr.stalled td { background: #fff3e0; }
tr.stalled td.c-label { box-shadow: inset 4px 0 0 var(--dash-amber); }
tr.terminal-row td { background: #fdf1f2; }
/* ROW TINT IS OUTCOME, PILLS ARE CONDITIONS (Julian, 2026-08-13). The tint is
   ONE consistent signal, readable across the room: GREEN finished, RED ended
   early, AMBER stalled, untinted still going. The four are mutually exclusive
   by construction (stalled requires an active row; finished requires no
   terminal state), so there is no precedence to resolve — but the rule to
   hold when adding the next state is the channel split: a CONDITION never
   touches the row. A finished non-SEPA participant keeps the GREEN row and
   the RED pill — the row says they completed, the pill says something about
   them still needs attention. Turning that row red would collapse outcome and
   condition back into one channel, which is exactly what the pills separated.
   The green is deliberately LIGHTER than the green pills&#x27; own background
   (#eaf6ef) so the finished tick, the earnings pill and the green quiz cell
   keep their edges against it instead of dissolving into a monotone row —
   the row colour only has to be scannable, not loud. */
tr.finished-row td { background: #f1faf4; }
tr.error-row td { color: var(--danger); }
/* UNRECOGNISED APP: its own colour, not amber and not the terminal pink — it is
   neither a slow participant nor an ended one, it is a gap in APP_STEPS. */
tr.unmapped-row td { background: #f5f1fd; }
tr.unmapped-row td.c-label { box-shadow: inset 4px 0 0 var(--dash-unmapped); }

.c-label { width: 15%; font-weight: 650; color: var(--ink);
  font-variant-numeric: tabular-nums; }
.c-label .code-fallback { color: var(--ink-mute); font-weight: 400;
  font-size: .85em; }
.c-label .page-hint { display: block; color: var(--ink-mute);
  font-weight: 400; font-size: .72rem; }

/* --- the timeline: EQUAL SPACING via one track per step -------------------
   BOTH numbers below are DERIVED from STEP_LABELS, not typed: the track count
   is len(STEPS), and the connector&#x27;s inset is half a track (100/steps/2) so the
   line starts and ends at the centre of the first and last markers. Hard-coding
   them was two more copies of &quot;how many steps are there&quot; — add a seventh step
   and a fixed 6-track grid would silently drop it off the end of the row. */
/* 46%, NOT LESS: narrowing this (44% was tried when the state column became
   pills) squeezes the header grid until the long step labels hit their
   min-content floor and the six tracks stop being equal — measured as a 3.8px
   spread by dashboard_render_check. The pills wrap inside their own cell
   instead (.state-pills is flex-wrap), so they need no width ceded to them. */
.c-timeline { width: 46%; }
.tl-header, .tl { display: grid;
  grid-template-columns: repeat(6, 1fr); }
.tl-header span { font-size: .68rem; text-align: center; }
.tl { align-items: center; position: relative; height: 30px; }
.tl::before { content: &#x27;&#x27;; position: absolute; left: 8.33%;
  right: 8.33%;
  top: 50%; height: 2px; background: var(--line-strong); }
.tl .stepcell { position: relative; display: flex; justify-content: center; }
.tl .dot { width: 8px; height: 8px; border-radius: 50%;
  background: var(--card-bg); border: 2px solid var(--line-strong); z-index: 1; }
.tl .stepcell.donestep .dot { background: var(--accent);
  border-color: var(--accent); }
/* The marker: occupies ONE step, advances when the step completes. During
   TASK it carries the round (&quot;3 of 10&quot;) and advances INSIDE the step. */
.tl .marker { z-index: 2; min-width: 26px; height: 22px; padding: 0 7px;
  border-radius: 11px; background: var(--accent); color: #fff;
  font-size: .78rem; font-weight: 650; display: flex; align-items: center;
  justify-content: center; white-space: nowrap;
  font-variant-numeric: tabular-nums; }
.tl .marker.done-marker { background: var(--ok); }
/* Terminal override: the emoji + state colour fill the marker wherever the
   participant had reached. */
.tl .marker.terminal-marker { background: #fdeaec;
  border: 2px solid var(--danger); font-size: .95rem; padding: 0 5px; }

.c-quiz { width: 8%; }
.quizcell { position: relative; min-width: 52px; height: 22px;
  border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: .8rem; font-weight: 650; background: var(--card-bg);
  font-variant-numeric: tabular-nums; }
.quizcell .fillbar { position: absolute; inset: 0; right: auto;
  background: var(--accent-soft); }
.quizcell span { position: relative; }
.quizcell.q-red { background: var(--danger); color: #fff;
  border-color: var(--danger); }
.quizcell.q-red .fillbar { display: none; }
.quizcell.q-green { background: var(--ok); color: #fff;
  border-color: var(--ok); }
.quizcell.q-green .fillbar { display: none; }
/* FORCED: an experimenter advanced them past the quiz without an answer (see
   _quiz_cell). Violet — the colour this screen already means &quot;not a participant
   behaviour&quot; by — and NOT red: nothing is wrong with the participant. */
.quizcell.q-forced { background: #f5f1fd; color: var(--dash-unmapped);
  border-color: var(--dash-unmapped); font-size: .72rem; }
.quizcell.q-forced .fillbar { display: none; }

/* --- PILLS: intro time and earnings (round-2 item 7) ----------------------
   These two are the QUANTITIES on this screen — the numbers an operator reads
   off rather than a state they glance at — so they get a shape of their own
   instead of sitting as bare text in a cell. Same pill for both, so the summary
   strip&#x27;s averages below are visibly the same kind of thing.
   Times and money must NEVER truncate or wrap: an unreadable number is worse
   than no column (review, 2026-08-12). nowrap + tabular numerals, on the pill
   itself so it holds whatever the cell width does. */
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px;
  background: var(--sunken); border: 1px solid var(--line);
  font-size: .82rem; font-weight: 650; color: var(--ink);
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.pill-live { background: var(--accent-soft); border-color: var(--accent);
  color: var(--accent); }
.pill.pill-earn { background: #eaf6ef; border-color: #bfe3cd; color: #1f7a46; }
.c-instr { width: 10%; white-space: nowrap; }
.c-earn { width: 10%; white-space: nowrap; }

/* =========================================================================
   THE OVERVIEW BLOCK — the header row and the four condensed pills.

   WHAT AN OPERATOR READS, IN ORDER. Supervising a live session is not analysis.
   Over a two-second poll the questions are: is the room full → how is the
   DESIGN filling → who has LEFT and how → what is it COSTING → how LONG is it
   taking. Everything per-participant is already a column, so the block carries
   only aggregates and pushes every detail to the `title` tooltip this screen
   already uses everywhere.

   THE COLOUR RULE — state it as a rule, because it is the thing a later hand
   undoes first:

     THE CONTAINER IS NEUTRAL. COLOUR BELONGS TO VALUES, AND ONLY WHERE IT
     CARRIES A MEANING THIS SCREEN ALREADY USES ELSEWHERE.

       GREEN   (#1f7a46)      completed, or money — the SAME green as the
                              finished row tint, .spill-finished and .pill-earn
       RED     (--danger)     ended early — the SAME red as .terminal-row and
                              .spill-terminal
       AMBER   (--dash-amber) stalled — the SAME amber as tr.stalled and
                              .spill-stall
       NEUTRAL (--ink)        a plain count with no valence: an assigned total,
                              a duration, a count of people still going

   A tinted frame and a tinted title spend the colour before the eye reaches the
   number: by the time you read `4`, red has been used on the border, the fill
   and the word, so the number&#x27;s redness adds nothing — and FINISHED people end
   up sitting inside a red object. Colour that is everywhere signals nothing.
   COROLLARY: a colour is never spent on a frame, a title, a key or a label.
   Those are structure. A value with no valence stays neutral; do not colour it
   to make a pill look livelier.

   THE HEADLINE GETS A SHAPE, THE DECOMPOSITION GETS INK. FINISHED appears
   twice — the session total in Participants, and split per treatment. The total
   sits in a green CHIP; the per-treatment numerators are green TEXT. One shape,
   so the eye lands on the total first. Two would compete and neither would lead.

   ALIGNMENT: ONE MODEL, BASELINE, PLUS ONE FIXED LINE BOX. Mixing
   `align-items: center` on a pill with `align-items: baseline` inside its value
   groups put the tiny keys 2.08px below the pill names (measured). Type of
   different sizes lines up on its BASELINE, not on its box centre — a box
   centre is a property of the line box, not of the glyphs. And baseline alone
   is not enough: a line box&#x27;s HEIGHT scales with font size, so three type sizes
   gave three box heights and pills 32.5/34.5/38.5px tall. Hence `line-height`
   in PIXELS on every leaf, and an explicit pill height so no single inner chip
   can resize its family. Pinned by dashboard_render_check.
   ========================================================================= */
.dash-overview {
  background: var(--card-bg); border: 1px solid var(--line);
  border-radius: var(--r-md); box-shadow: var(--shadow);
  padding: 11px 14px 12px; margin-bottom: 14px;
}
.dash-overview .dash-top { margin-bottom: 0; }
.ov-strip {
  display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap;
  margin-top: 9px; padding-top: 10px; border-top: 1px solid var(--line);
}
.ov-strip:empty { display: none; }

.ov {
  display: inline-flex; align-items: baseline; gap: 8px;
  border: 1px solid var(--line); border-radius: 999px;
  padding: 0 11px 0 10px; height: 32px; background: var(--sunken);
  font-size: .8rem; color: var(--ink-soft);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
/* THE FIXED LINE BOX — see ALIGNMENT above. One height for every leaf,
   whatever its font size, so the boxes coincide instead of nesting. */
.ov, .ov * { line-height: 20px; }
.ov-label { font-size: .72rem; font-weight: 700; letter-spacing: .015em;
  color: var(--ink); }
/* A VALUE GROUP: tiny key, heavy number, optional denominator. The key is what
   makes a bare number legible without a tooltip. */
.ov-pair { display: inline-flex; align-items: baseline; gap: 4px; }
.ov-pair i { font-style: normal; font-size: .66rem; text-transform: uppercase;
  letter-spacing: .05em; font-weight: 650; color: var(--ink-mute); }
.ov-pair em { font-style: normal; font-size: .95rem; font-weight: 700;
  color: var(--ink); }
.ov-pair s { text-decoration: none; }
.ov-pair u { text-decoration: none; font-size: .95rem; font-weight: 700;
  color: var(--ink); }
.ov-sub, .ov-tail, .ov-unit, .ov-den {
  font-size: .68rem; letter-spacing: .01em; color: var(--ink-mute); }
.ov-tail { padding-left: 8px; border-left: 1px solid var(--line-strong); }

/* TREATMENTS. The NUMERATORS are completions, so they take the green; the
   DENOMINATORS are the balance — a plain count, no valence — so they stay
   neutral ink and the two side by side read as the comparison they are. */
.ov-treat .ov-pair em { color: #1f7a46; }
.ov-treat .ov-pair s { color: var(--ink-mute); opacity: .55; }

/* PARTICIPANTS. Neutral pill; the buckets carry the colour. The wide sibling
   gap lives HERE, on the one pill with a NESTED item to tell from its siblings
   — 12px between buckets against 4px inside the nest. */
.ov-people { gap: 12px; }
/* IN PROGRESS, WITH STALLED NESTED INSIDE IT. Stalled is a CONDITION on a
   subset of the people still going, not a fourth outcome; rendering it as a
   sibling number is exactly the ambiguity this arrangement removes (it used to
   sit on the header line beside &quot;10 in progress&quot; and read as a third parallel
   total). THREE CUES carry the containment, cheap and redundant:
     1. PARENTHESES — the universal &quot;this qualifies the thing before it&quot;, and
        unlike an arrow or a bracket glyph they cannot come out as tofu;
     2. PROXIMITY — 4px to its parent against 12px between siblings, so the eye
        groups it before it reads it;
     3. COLOUR — amber, which on this screen already means STALLED and nothing
        else, against the neutral ink of the count it sits inside.
   The tooltip says &quot;of which&quot; in words, so the glance and the reading agree. */
.ov-nest { display: inline-flex; align-items: baseline; gap: 4px;
  font-size: .68rem; color: var(--ink-soft); }
.ov-nest em { font-style: normal; font-size: .95rem; font-weight: 700;
  color: var(--ink); }
.ov-stall { color: var(--dash-amber); font-weight: 650; }
.ov-chip { display: inline-flex; align-items: baseline; gap: 4px;
  background: #eaf6ef; border: 1px solid #bfe3cd; border-radius: 999px;
  padding: 0 9px; color: #1f7a46; font-size: .68rem; }
/* The chip&#x27;s border adds 2px, so its inner line box is 2px shorter and it lands
   exactly on the pill&#x27;s 20px line — otherwise this one element makes the
   Participants pill taller than its three siblings. */
.ov-chip, .ov-chip * { line-height: 18px; }
.ov-chip em { font-style: normal; font-size: .95rem; font-weight: 700;
  color: #1f7a46; }
.ov-early { font-size: .68rem; color: var(--danger); }
.ov-early em { font-style: normal; font-size: .95rem; font-weight: 700;
  color: var(--danger); }

/* EARNINGS. Money takes the same green .pill-earn already uses. */
.ov-earn .ov-pair em { color: #1f7a46; }
/* TIME. Durations have no valence, so they stay neutral. Each figure carries
   its OWN denominator: the two averages are over DIFFERENT populations. */
.ov-den { opacity: .85; }

/* THE UNDECLARED-CODE ALARM ROW. Below the strip, full width, hidden when
   empty. It was a chip inside the Participants pill and cost 95px of a 1366px
   strip, pushing the fourth pill onto a second line — an alarm should not be
   what breaks the layout, and it should not compete for width with routine
   counts. Its own row is both louder and cheaper. */
.ov-alert {
  display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
  margin-top: 8px; padding: 7px 11px; font-size: .76rem;
  color: var(--ink-soft); background: #fdeaec;
  border: 1px solid #eab5bd; border-left: 4px solid var(--danger);
  border-radius: var(--r-sm);
}
.ov-alert:empty { display: none; }
.ov-alert code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas,
  monospace; font-size: .92em; color: var(--danger); }
.ov-alert b { color: var(--danger); }
.ov-flag { font-size: .66rem; font-weight: 700; padding: 2px 8px;
  border-radius: 999px; background: var(--danger); color: #fff;
  letter-spacing: .01em; }

/* =========================================================================
   THE HEADER ROW. It read as a run-on line — title, a bare grey code and three
   counts at one weight with one gap — so nothing said which part was the study,
   which was the identifier and which was the census. Two clusters now:

     [ title | SESSION &lt;code&gt; · 👤 x of y arrived ]      [ view control · updated ]

   THE SESSION CODE IS AN IDENTIFIER, SO IT IS SET LIKE ONE: a quiet uppercase
   key, then the code in a monospace chip. Monospace because a session code is
   read character by character and sometimes typed, and proportional type
   invites misreading rn/m and 1/l. SYSTEM monospace only — base.css&#x27;s
   no-network constraint forbids a webfont and every platform ships one of
   these.
   THE SEPARATOR is the same U+00B7 the census already uses between its own
   segments, so the row has ONE separator vocabulary rather than a mix of dots,
   pipes and bare spaces.
   ========================================================================= */
.dash-top { gap: 10px; }
.hdr-rule { align-self: stretch; width: 1px; min-height: 1.1em;
  background: var(--line-strong); margin: 0 2px; }
.hdr-session { display: inline-flex; align-items: baseline; gap: 6px; }
.hdr-key { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em;
  font-weight: 650; color: var(--ink-mute); }
.hdr-code {
  font-family: ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas,
               &quot;Liberation Mono&quot;, monospace;
  font-size: .78rem; font-weight: 650; color: var(--ink);
  background: var(--sunken); border: 1px solid var(--line-strong);
  border-radius: var(--r-sm); padding: 2px 7px; letter-spacing: .02em;
}
.hdr-dot { color: var(--ink-mute); margin: 0 -3px; }
.dash-counts b { color: var(--ink); font-weight: 700;
  font-variant-numeric: tabular-nums; }
/* THE TWO CLUSTERS, actually separated. The view control is a VIEW control, not
   part of the census — glued to the arrival count it made the left half read as
   one run-on line again. `margin-left: auto` on the control opens the gap; the
   status must then give up its own auto margin, or the two would split the free
   space between them and strand the control mid-row. */
.dash-top .dash-controls { margin-left: auto; }
.dash-top .dash-status { margin-left: 0; }

/* The header&#x27;s threshold affordance (item 17): quiet, but obviously hoverable,
   and focusable so it is reachable without a mouse. */
.th-info { cursor: help; color: var(--ink-mute); font-size: .95rem;
  margin-left: 4px; }
.th-info:hover, .th-info:focus { color: var(--accent); }
/* --- THE STATE COLUMN: A COLLECTION OF PILLS (Julian, 2026-08-13) ----------
   Not a single state: OUTCOME pills (a terminal state, the green finished
   tick) and CONDITION pills (the timing warning, the lab&#x27;s Non-SEPA flag)
   ACCUMULATE in one cell — a finished row keeps its condition pills, because
   finishing does not make a condition go away. See stateHTML for the order.
   flex-wrap, so several pills stack to a second line instead of clipping
   (times and money must never truncate — the same rule as .pill above). */
.c-state { width: 13%; font-size: .85rem; }
.state-pills { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.spill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px;
  border-radius: 999px; font-size: .78rem; font-weight: 650;
  white-space: nowrap; border: 1px solid transparent;
  font-variant-numeric: tabular-nums; }
.spill .emoji { font-size: .95rem; }
.spill-finished { background: #eaf6ef; border-color: #bfe3cd; color: #1f7a46; }
.spill-terminal { background: #fdeaec; border-color: var(--danger);
  color: var(--danger); }
/* TIMING: yellow, filled. The pill names WHICH phase is slow and by how much;
   the amber row tint (above) is what makes the row findable at a glance. */
.spill-stall { background: #fff3c9; border-color: #eab308;
  color: var(--dash-amber); }
/* NON-SEPA: red background, white text (Julian&#x27;s spec) — the one pill about
   money possibly not arriving, so it outshouts everything else in the cell. */
.spill-nonsepa { background: var(--danger); border-color: var(--danger);
  color: #fff; }
/* MONITOR CLIMBING: outlined red — the DQ&#x27;s own colour and its own 👀, at
   reduced weight, because it is that state approaching rather than arrived. */
.spill-monitor { background: var(--card-bg); border-color: var(--danger);
  color: var(--danger); }
/* NO RETURN CLICK: outlined amber — a payment-flow worry, not a certainty
   (the stamp is best-effort), so quieter than the filled pills. */
.spill-return { background: var(--card-bg); border-color: var(--dash-amber);
  color: var(--dash-amber); }
.spill-unmapped { background: #f5f1fd; border-color: var(--dash-unmapped);
  color: var(--dash-unmapped); }
/* WAITING FOR: outlined ACCENT BLUE — informational, not wrong. See stateHTML. */
.spill-waiting { background: var(--card-bg); border-color: var(--accent);
  color: var(--accent); }

/* The two colours base.css has no token for: an operator-screen amber and the
   unrecognised-app violet. Declared as tokens rather than inlined so the row
   background and the text stay one decision. */
:root { --dash-amber: #b45309; --dash-unmapped: #6b21a8; }

/* =========================================================================
   THE QUIZ-MISTAKES PANEL (on-demand, opened from the Quiz header&#x27;s ⓘ).
   INTENTION: show what people got wrong in the comprehension quiz and what
   they answered instead — first attempt only, first pass vs re-read pass kept
   apart, worst item first. This is the approved mock (_ai/quiz_mistakes_mock
   .html) reproduced in the dashboard&#x27;s OWN tokens: the sunken/line/card
   surfaces, --shadow-lift, the danger red for wrong and --ok green for
   correct, and the unplaced-app violet (--dash-unmapped) for the re-read pass
   and the excluded-junk note — the same violet this screen already means
   &quot;not a participant behaviour&quot; by. The handful of tints below (the wrong/
   correct chip fills, the rate-bar track) are the mock&#x27;s, carried over so the
   panel reads as one control room with the table. Escape-dismissible, the
   convention for generic modals here. Only the panel styles live here; the
   trigger reuses .th-info above.
   ========================================================================= */
.qm-overlay { position: fixed; inset: 0; z-index: 50; display: none;
  background: rgba(16, 32, 52, .28); padding: 24px; overflow: auto; }
.qm-overlay.open { display: block; }
.qm-panel { max-width: 1080px; margin: 0 auto; background: var(--card-bg);
  border: 1px solid var(--line); border-radius: var(--r-md);
  box-shadow: var(--shadow-lift); overflow: hidden; }
.qm-head { display: flex; align-items: flex-start; gap: 14px;
  padding: 16px 20px; border-bottom: 1px solid var(--line-strong);
  background: var(--sunken); }
.qm-head h2 { margin: 0 0 3px; font-size: 1.05rem; }
.qm-head .pop { font-size: .82rem; color: var(--ink-mute); }
.qm-head .pop b { color: var(--ink-soft); }
.qm-head .spacer { margin-left: auto; }
.qm-asof { font-size: .74rem; color: var(--ink-mute); white-space: nowrap; }
.qm-btn { font: inherit; font-size: .8rem; font-weight: 650; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--card-bg);
  color: var(--ink-soft); border-radius: 999px; padding: 3px 12px; }
.qm-btn:hover { border-color: var(--accent); color: var(--accent); }
.qm-close { border: none; background: transparent; font-size: 1.3rem;
  line-height: 1; color: var(--ink-mute); cursor: pointer; padding: 0 2px; }
.qm-close:hover { color: var(--accent); }
.qm-body { padding: 16px 20px 20px; }
.qm-msg { padding: 24px; text-align: center; color: var(--ink-mute); }
.qm-err { border: 1px solid var(--danger); background: #fdeaec;
  color: var(--danger); border-radius: var(--r-sm); padding: 10px 14px;
  font-size: .86rem; margin-bottom: 12px; }
.qm-excluded { display: flex; gap: 10px; align-items: flex-start;
  background: #f5f1fd; border: 1px solid #e2d6f7;
  border-left: 4px solid var(--dash-unmapped); border-radius: var(--r-sm);
  padding: 9px 12px; margin-bottom: 18px; font-size: .84rem;
  color: var(--ink-soft); }
.qm-excluded b { color: var(--dash-unmapped); }
.qm-section-label { font-size: .76rem; text-transform: uppercase;
  letter-spacing: .05em; color: var(--ink-mute); font-weight: 650;
  margin: 4px 2px 10px; }
.item-card { border: 1px solid var(--line); border-radius: var(--r-md);
  background: var(--card-bg); box-shadow: var(--shadow); margin-bottom: 12px;
  overflow: hidden; }
.item-card.missed { border-color: #eab5bd; }
.item-card &gt; .prompt { padding: 10px 14px; border-bottom: 1px solid var(--line);
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.item-card &gt; .prompt .qno { font-size: .72rem; font-weight: 650;
  color: var(--ink-mute); font-variant-numeric: tabular-nums; }
.item-card &gt; .prompt .qtext { color: var(--ink); font-weight: 650;
  font-size: .95rem; }
.badge-missed { font-size: .68rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .04em; color: var(--danger); background: #fdeaec;
  border: 1px solid #eab5bd; border-radius: 999px; padding: 1px 8px; }
.passes { display: grid; grid-template-columns: 1fr 1fr; }
.pass { padding: 12px 14px; }
.pass + .pass { border-left: 1px solid var(--line); }
.pass &gt; .phdr { display: flex; align-items: baseline; gap: 8px;
  margin-bottom: 9px; }
.pass &gt; .phdr .name { font-size: .74rem; text-transform: uppercase;
  letter-spacing: .04em; font-weight: 650; color: var(--ink-soft); }
.pass &gt; .phdr .n { font-size: .72rem; color: var(--ink-mute); }
.pass.reread &gt; .phdr .name { color: var(--dash-unmapped); }
.rate { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.rate .bar { flex: 1; height: 7px; border-radius: 999px; background: #f0dfe2;
  overflow: hidden; }
.rate .bar &gt; i { display: block; height: 100%; background: var(--ok); }
.rate.bad .bar &gt; i { background: var(--danger); }
.rate .txt { font-size: .78rem; font-weight: 650; color: var(--ink-soft);
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.opt-none { font-size: .8rem; color: var(--ink-mute); font-style: italic; }
.opts { display: flex; flex-direction: column; gap: 5px; }
.opt { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px;
  align-items: center; }
.opt .lbl { display: flex; align-items: center; gap: 6px; min-width: 0; }
.opt .mark { flex: none; width: 15px; text-align: center; font-weight: 700;
  font-size: .82rem; }
.opt .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-size: .82rem; color: var(--ink); }
.opt .cnt { font-size: .78rem; font-weight: 650; color: var(--ink-soft);
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.opt .track { grid-column: 1 / -1; height: 5px; border-radius: 999px;
  background: var(--sunken); overflow: hidden; }
.opt .track &gt; i { display: block; height: 100%; }
.opt.correct .mark { color: var(--ok); }
.opt.correct .track &gt; i { background: var(--ok); }
.opt.wrong .mark { color: var(--danger); }
.opt.wrong .txt { color: var(--danger); }
.opt.wrong .track &gt; i { background: var(--danger); }
.pp-scroll { overflow-x: auto; border: 1px solid var(--line);
  border-radius: var(--r-md); box-shadow: var(--shadow);
  background: var(--card-bg); }
table.pp { border-collapse: collapse; width: 100%; min-width: 720px; }
table.pp th { text-align: left; font-size: .7rem; text-transform: uppercase;
  letter-spacing: .04em; color: var(--ink-mute); background: var(--sunken);
  padding: 7px 9px; border-bottom: 1px solid var(--line-strong);
  white-space: nowrap; }
table.pp th.qh { text-align: center; cursor: help; }
table.pp td { padding: 6px 9px; border-bottom: 1px solid var(--line);
  vertical-align: middle; font-size: .84rem; }
table.pp td.name { font-weight: 650; color: var(--ink);
  font-variant-numeric: tabular-nums; white-space: nowrap; }
table.pp td.pass-tag { font-size: .7rem; text-transform: uppercase;
  letter-spacing: .03em; color: var(--ink-mute); white-space: nowrap; }
table.pp td.pass-tag.reread { color: var(--dash-unmapped); font-weight: 650; }
table.pp td.cell { text-align: center; }
.mk { display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 20px; border-radius: 6px; font-size: .78rem;
  font-weight: 700; padding: 0 5px; }
.mk.ok { background: #eaf6ef; color: var(--ok); border: 1px solid #bfe3cd; }
.mk.no { background: #fdeaec; color: var(--danger); border: 1px solid #eab5bd;
  cursor: help; }
.mk.blank { color: var(--ink-mute); }
tr.forced-row td { background: #faf7fe; }
tr.forced-row td.name { color: var(--dash-unmapped); }
.forced-tag { font-size: .72rem; font-weight: 650; color: var(--dash-unmapped);
  background: #f5f1fd; border: 1px solid #e2d6f7; border-radius: 999px;
  padding: 1px 8px; white-space: nowrap; }
tr.qm-unreadable td { color: var(--dash-amber); background: #fffceb; }
.later-row td { background: var(--sunken); font-size: .8rem;
  color: var(--ink-soft); }
.later-row.hidden { display: none; }
.later-wrap { display: flex; flex-direction: column; gap: 4px; padding: 2px 0; }
.later-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.later-line .an { font-size: .72rem; font-weight: 650; color: var(--ink-mute);
  white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px;
  border-radius: 999px; font-size: .74rem; white-space: nowrap;
  max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.chip.ok { background: #eaf6ef; color: #1f7a46; border: 1px solid #bfe3cd; }
.chip.no { background: #fdeaec; color: var(--danger); border: 1px solid #eab5bd; }
.expander { font: inherit; font-size: .74rem; font-weight: 650; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--card-bg);
  color: var(--ink-mute); border-radius: 999px; padding: 0 8px;
  line-height: 1.6; }
.expander:hover { border-color: var(--accent); color: var(--accent); }
.qm-legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 8px 2px 14px;
  font-size: .76rem; color: var(--ink-mute); }
.qm-legend span { display: inline-flex; align-items: center; gap: 5px; }
@media (max-width: 720px) { .passes { grid-template-columns: 1fr; }
  .pass + .pass { border-left: none; border-top: 1px solid var(--line); } }

&lt;!-- THE OVERVIEW BLOCK: the header row, then the four condensed pills, then
     the alarm row. One section about who is here and how it is going. --&gt;
&lt;div class=&quot;dash-overview&quot; id=&quot;overview&quot;&gt;
  &lt;div class=&quot;dash-top&quot;&gt;
    &lt;h1&gt;Lab session (CREED)&lt;/h1&gt;
    &lt;span class=&quot;hdr-rule&quot;&gt;&lt;/span&gt;
    &lt;span class=&quot;hdr-session&quot;&gt;&lt;span class=&quot;hdr-key&quot;&gt;Session&lt;/span&gt;
      &lt;code class=&quot;hdr-code&quot;&gt;demo1234&lt;/code&gt;&lt;/span&gt;
    &lt;span class=&quot;hdr-dot&quot;&gt;·&lt;/span&gt;
    &lt;span class=&quot;dash-counts&quot; id=&quot;counts&quot;&gt;👤 &lt;b&gt;17&lt;/b&gt; of &lt;b&gt;18&lt;/b&gt; arrived&lt;/span&gt;
    &lt;label class=&quot;dash-controls&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;hide-entry&quot;&gt;
      hide not-arrived rows&lt;/label&gt;
    &lt;span class=&quot;dash-status&quot; id=&quot;status&quot;&gt;updated 10:42:18 AM&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ov-strip&quot; id=&quot;ov-strip&quot;&gt;&lt;span class=&quot;ov ov-treat&quot; title=&quot;Treatment cells. Each pair is FINISHED of ASSIGNED, so the denominators side by side are the balance the assigner maintains (least-filled cell on arrival, random tie-break) and the numerators are completion. Assigned minus finished is NOT still going: it also holds anyone who abandoned or was ejected after the instructions. Names come from settings.TREATMENT_CELLS, so this can never show a treatment the code does not have.&quot;&gt;&lt;b class=&quot;ov-label&quot;&gt;Treatments&lt;/b&gt;&lt;span class=&quot;ov-pair&quot;&gt;&lt;i&gt;row&lt;/i&gt;&lt;em&gt;2&lt;/em&gt;&lt;s&gt;/&lt;/s&gt;&lt;u&gt;8&lt;/u&gt;&lt;/span&gt;&lt;span class=&quot;ov-pair&quot;&gt;&lt;i&gt;column&lt;/i&gt;&lt;em&gt;1&lt;/em&gt;&lt;s&gt;/&lt;/s&gt;&lt;u&gt;7&lt;/u&gt;&lt;/span&gt;&lt;span class=&quot;ov-tail&quot;&gt;3 unassigned&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;ov ov-people&quot; title=&quot;THE STATE OF PEOPLE — the three buckets that partition everyone who has ARRIVED (the x of y above).
IN PROGRESS 14, OF WHICH STALLED 2 — too long in one phase against that phase threshold. A CONDITION on people who are still going, NOT a fourth outcome, which is why it is nested inside the in-progress number rather than set beside it.
FINISHED 3
ENDED EARLY 0
   turned away at entry — 0
   ejected after starting — 0
   unclassified — 0
NOT SHOWN, deliberately: an &amp;quot;abandoned&amp;quot; count. Exit code 0 means &amp;quot;never reached an ending&amp;quot; and is what everyone is initialised to, so live it cannot tell somebody working right now from somebody who closed the tab — they are inside IN PROGRESS.&quot;&gt;&lt;b class=&quot;ov-label&quot;&gt;Participants&lt;/b&gt;&lt;span class=&quot;ov-nest&quot;&gt;&lt;em&gt;14&lt;/em&gt; in progress&lt;span class=&quot;ov-stall&quot;&gt;(2 stalled)&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;ov-chip&quot;&gt;&lt;em&gt;3&lt;/em&gt; finished&lt;/span&gt;&lt;span class=&quot;ov-early&quot;&gt;&lt;em&gt;0&lt;/em&gt; ended early&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;ov ov-earn&quot; title=&quot;Earnings over the FINISHED participants — the average and the total, both read off the ONE figure summed on the server from the same earnings the rows show, so neither can disagree with the per-row cells. Earnings do not exist until the results page computes them, so this population is forced by the data.&quot;&gt;&lt;b class=&quot;ov-label&quot;&gt;Earnings&lt;/b&gt;&lt;span class=&quot;ov-pair&quot;&gt;&lt;i&gt;avg&lt;/i&gt;&lt;em&gt;16.25&lt;/em&gt;&lt;/span&gt;&lt;span class=&quot;ov-pair&quot;&gt;&lt;i&gt;total&lt;/i&gt;&lt;em&gt;48.75&lt;/em&gt;&lt;/span&gt;&lt;span class=&quot;ov-unit&quot;&gt;EUR&lt;/span&gt;&lt;span class=&quot;ov-tail&quot;&gt;of 3&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;ov ov-time&quot; title=&quot;TWO AVERAGES, TWO DIFFERENT POPULATIONS — each over the participants who completed THAT stage. INTRO: mean time inside the intro app, over everyone whose intro time is settled (they have a quiz_done stamp and are out of the intro) — it includes people now in the task, the questionnaire, finished, or ejected after the intro. EXPERIMENT: mean time for the whole run, first stamp to the finished stamp, over those who FINISHED the study; nothing else can have it. Both summed on the server from the same stage timestamps the rows use.&quot;&gt;&lt;b class=&quot;ov-label&quot;&gt;Time (avg)&lt;/b&gt;&lt;span class=&quot;ov-pair&quot;&gt;&lt;i&gt;intro&lt;/i&gt;&lt;em&gt;3:55&lt;/em&gt;&lt;s class=&quot;ov-den&quot;&gt;of 11&lt;/s&gt;&lt;/span&gt;&lt;span class=&quot;ov-pair&quot;&gt;&lt;i&gt;experiment&lt;/i&gt;&lt;em&gt;22:18&lt;/em&gt;&lt;s class=&quot;ov-den&quot;&gt;of 3&lt;/s&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;ov-alert&quot; id=&quot;ov-alert&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

    &lt;span class=&quot;th-info&quot; id=&quot;quiz-mistakes-info&quot; tabindex=&quot;0&quot; role=&quot;button&quot; title=&quot;What people got wrong on the quiz — click to open&quot;&gt;ⓘ&lt;/span&gt;
