<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experimenter monitor — oTree study template</title>
<!--
  =========================================================================
  WHAT THIS FILE IS
  =========================================================================
  A DISPLAY ARTEFACT for the academic website: one screen of the CREED oTree
  study template, shown in a 16:9 iframe. It is NOT participant-facing, it is
  not wired to anything, and it is not part of the shipped study apps.

  THE EXPERIMENTER MONITOR — the operator's screen, not a participant's.
  It is a live view of one running session: one row per participant, a
  six-step timeline showing where each of them is, and pills for the
  things somebody in the room has to act on.

  THE SESSION IS INVENTED. Nineteen rows, no real participant behind any of
  them: no Prolific IDs (a Prolific row's label IS the platform ID), no
  completion codes, no contact or bank details — the screen has no column
  for any of those. The rows are in scripts/site_previews/monitor_session.py.

  IT IS A LAB SESSION, AND THAT IS WHY THERE ARE NO RED "ENDED EARLY" ROWS.
  All four terminal states (screened out, declined consent, comprehension
  DQ, tab-monitor DQ) need a module the lab profile switches OFF, so a lab
  monitor genuinely never shows one. An online session does; showing them
  here would be a picture of a configuration this study does not run.

  THE ROWS WERE DRAWN BY THE DASHBOARD ITSELF. This is not a mock-up of the
  monitor: experimenter_dashboard.py's own JavaScript rendered every row
  below, and the DOM it produced was then frozen so the page needs no
  server and no scripts. The controls are therefore inert here — the live
  screen refreshes itself every two seconds.

  =========================================================================
  HOW IT WAS MADE — do not hand-edit this file
  =========================================================================
  Generated from the live template by scripts/site_previews/build_site_previews.py.
  Hand-editing it is how the previous website snapshots went stale: edit the
  body in scripts/site_previews/bodies/ and RE-RUN THE SCRIPT instead, and
  re-run it whenever _static/global/css/ changes, or this screen quietly
  stops representing the study.

  SELF-CONTAINED BY REQUIREMENT: it is loaded on a static site with no access
  to the study repository, so there is no stylesheet link, no font, no script
  and no image by URL anywhere in this file. Every rule inside the frame
  below is copied verbatim from _static/global/css/; the two institutional
  marks are embedded as data URIs.

  WHY THE NESTED FRAME: the template sizes itself in viewport units (the card
  is 88vh; base.css tightens its rhythm below 820px of height), so the layout
  is only defined at a given screen size. The screen is therefore drawn on a
  fixed 1920x1080 canvas — an ordinary participant display — inside its own
  browsing context, where those units resolve as they do for a participant,
  and the canvas is scaled to fill whatever 16:9 box the page is given. The
  scale is pure CSS (a length divided by a length is a number), so it works
  with scripts disabled.
-->
<style>
/* PREVIEW SHELL — the only hand-written CSS in this file. It positions the
   canvas; it never styles the screen inside it. */
html, body { margin: 0; height: 100%; overflow: hidden; background: #eef1f6; }
/* The staging box the render must fit inside. container-type makes 100cqw below
   resolve against THIS element's content width (page-driven, scrollbar-excluded)
   rather than the viewport, so the fit no longer depends on Windows
   scrollbars/DPI. #screen is position:absolute, so it never feeds back into this width. */
body { container-type: inline-size; }
#screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    border: 0;
    transform-origin: top left;
    transform: scale(calc(100cqw / 1920px));
}
</style>
</head>
<body>
<iframe id="screen" title="Experimenter monitor" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;title&gt;Dashboard — Lab session (CREED)&lt;/title&gt;
&lt;style&gt;
/* ===== base.css — verbatim from _static/global/css/ ===== */

/* ===========================================================================
   Participant-facing design system.

   One shared shell for every screen (welcome, consent, instructions, quiz,
   task, results) so the study reads as a single designed product.

   Constraints: plain CSS only. No external fonts, no CDN, no network calls of
   any kind (a study may run on Prolific, where an outbound request is both a
   privacy leak and a point of failure). System font stack, hand-rolled
   controls. Everything is fluid and legible down to a 320px phone.
   =========================================================================== */

:root {
    /* --- surfaces --------------------------------------------------------- */
    --page-bg: #eef1f6;
    --card-bg: #ffffff;
    --sunken: #f4f6fa;
    --line: #e3e8ef;
    --line-strong: #cbd5e1;

    /* --- ink -------------------------------------------------------------- */
    --ink: #16202c;
    --ink-soft: #4a5766;
    --ink-mute: #71808f;

    /* --- accent (actions only; used sparingly and on purpose) ------------- */
    --accent: #2f6feb;
    --accent-hover: #1f57c9;
    --accent-soft: #e8effd;
    --accent-ring: rgba(47, 111, 235, 0.32);

    --danger: #c2384a;
    --ok: #1f9254;

    /* --- shape ------------------------------------------------------------ */
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 18px;
    --shadow: 0 1px 2px rgba(16, 32, 52, .04), 0 8px 28px rgba(16, 32, 52, .07);
    --shadow-lift: 0 2px 4px rgba(16, 32, 52, .06), 0 14px 38px rgba(16, 32, 52, .12);

    /* The reading measure: the width running prose is held to for legibility.
       Lives in ONE place, so every text family (narrative, instructions, quiz)
       narrows running text to the SAME width. Controls, tables and widgets are
       deliberately NOT clamped to it (see notes below). */
    --read-measure: 68ch;

    /* Gap between stacked options in one multiple-choice group (see the
       mc-option component). */
    --mc-gap: 10px;

    /* --- COMPATIBILITY ALIASES -------------------------------------------
       The tokens above are the design system. These older `--color-*` names
       are kept as aliases ONLY so page-scoped stylesheets that predate the
       rename (results.css, demographics.css, quiz.css) keep working untouched.
       DO NOT use them in new rules — reach for the real token instead. A new
       study is free to delete this block once nothing references it. */
    --color-background: var(--card-bg);
    --color-page-bg: var(--page-bg);
    --color-text: var(--ink-soft);
    --color-heading: var(--ink);
    --color-accent: var(--accent);
    --color-border: var(--line-strong);
    --color-muted: var(--ink-mute);
    --color-muted-hover: var(--ink-soft);
    --color-primary: var(--accent);
    --color-primary-hover: var(--accent-hover);
    --color-disabled: var(--line-strong);
    --color-table-header: var(--sunken);
    --color-table-selected: var(--accent-soft);
    --color-focus-ring: var(--accent-ring);
    --reading-measure: var(--read-measure);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

/* General layout &amp; typography.
   System font stack only — no webfont is bundled and none may be fetched (see
   the no-network constraint above). Fluid base size: comfortable on a phone,
   generous on a desktop. */
body {
    margin: 0;
    padding: 0;
    background: var(--page-bg);
    color: var(--ink-soft);
    font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
                 &quot;Helvetica Neue&quot;, Arial, &quot;Noto Sans&quot;, sans-serif;
    font-size: clamp(16px, 0.55vw + 14.6px, 19px);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { color: var(--ink); font-weight: 650; letter-spacing: -0.011em; }

p { margin: 0 0 1em; }
p:last-child { margin-bottom: 0; }

/* Bold text is the SAME ink as body copy, just heavier — emphasis must not
   shout in a second colour. */
strong { color: var(--ink); font-weight: 650; }

a { color: var(--accent); }

/* --- neutralise oTree&#x27;s page chrome ------------------------------------------
   oTree wraps every page in &lt;div class=&quot;otree-body container&quot;&gt;: its theme CSS
   gives .otree-body a max-width and a top margin, and Bootstrap&#x27;s .container
   adds its own width caps and gutters. Together they cap the card width and add
   a grey band above it. Zero all of it so .experimental-screen below is the only
   shell that sets widths and gutters. (.otree-body.container out-ranks both
   single-class originals on specificity, so load order cannot matter.) */
.otree-body.container {
    max-width: none;
    width: 100%;
    margin-top: 0;
    padding-left: 0;
    padding-right: 0;
}
/* WIDTH IS LOAD-BEARING HERE, not cosmetic. oTree wraps the page in
   &lt;form class=&quot;otree-form&quot;&gt;, and the `form` rule further down this file makes it
   a flex column with `align-items: center`. That makes .otree-content — the
   form&#x27;s only flex item, and the ancestor of every card — SHRINK-TO-FIT its
   content, so `.screen-card`&#x27;s own `max-width: min(94vw, 1200px)` never binds
   and each page&#x27;s card ends up as wide as whatever happens to be inside it.
   Measured before this line (1280px viewport): lab gate 651px, consent 824px,
   instructions 818px, quiz 571px — four widths for the one frame the card
   component promises. `width: 100%` restores the promise without touching the
   `form` rule, which oTree&#x27;s own injected elements also sit under. */
.otree-content { margin-top: 0; width: 100%; }
.otree-title.page-header { margin: 0; }

/* --- remove oTree&#x27;s &quot;powered by oTree&quot; line + trailing spacer ----------------
   oTree&#x27;s Page.html injects a `.powered-by-otree` line and a trailing &lt;br/&gt;
   after the content, both OUTSIDE our .experimental-screen. Both add stray
   whitespace below the card that made the bottom gutter deeper than the sides.
   (On the licence: the AGPL is satisfied by CITING THE OTREE PAPER — Chen,
   Schonger &amp; Wickens, 2016 — not by displaying the badge. We cite it; see the
   README.) */
.powered-by-otree { display: none; }
.otree-body.container &gt; br { display: none; }

/* COMPONENT — page shell. INTENTION: centre one card in the viewport with an
   equal grey gutter on every side (see EQUAL MARGINS below). Every participant
   page is one .experimental-screen wrapping one .screen-card. */
.experimental-screen {
    display: flex;
    justify-content: center;   /* horizontal centring */
    /* THE CARD TOP IS ANCHORED, NOT CENTRED, YET SYMMETRIC AT REST (Julian,
       2026-08-18). The card&#x27;s top edge must sit at the SAME position on every
       page — a viewport-centred card moves its top up and down as content height
       changes, which is exactly the jump he does not want. So the card is aligned
       to the START of the shell (top-anchored) in ALL THREE modes, at a top
       offset of --card-margin below the viewport top. Because the resting floor
       is `--card-min = 100dvh − 2·--card-margin`, a resting card fills the middle
       and leaves the SAME margin below it as above (top = bottom = --card-margin)
       — symmetric, so at rest it reads as centred — while a card TALLER than the
       floor grows DOWNWARD from that fixed top and the whole page scrolls, top
       unmoved. One token, --card-margin, sets both the offset here and the floor,
       so the anchor is a viewport FRACTION and the two cannot drift.
       `safe center` is gone from here on purpose — it was the vertical centring
       that moved the top. */
    align-items: flex-start;
    /* Fill the viewport so a resting card sits in a full-height frame; min-height
       (not height) means a card TALLER than the viewport simply grows the page
       downward from the anchored top: it stays fully reachable and the page
       scrolls, rather than being clipped. */
    min-height: 100vh;
    /* VERTICAL padding = --card-margin, so the top offset equals the resting
       bottom margin (symmetry) and tracks the viewport. HORIZONTAL padding is the
       3vw side gutter — the SAME as the card&#x27;s own 94vw side gutter
       ((100 − 94)/2 = 3vw) — so a width-limited card sits in an even side band. */
    padding: var(--card-margin) clamp(16px, 3vw, 40px);
    background: var(--page-bg);
}

/* COMPONENT — card frame. INTENTION: the single white card every page sits in.
   ONE card width for EVERY page; its height responds to content. Long-form text
   stays readable because running text carries its own reading band; functional
   components (tables, widgets) span the card&#x27;s inner width.

   HEIGHT — MODE 1, THE DEFAULT: A FLOOR, AND NO CEILING (2026-08-18 scroll-model
   overhaul; see DECISIONS.md &quot;The scroll model is three modes&quot; and
   _ai/scroll_model/). The card is never shorter than --card-min, so a one-line
   page still fills the screen and does not collapse to a stub. There is NO
   max-height: a card taller than the floor simply grows with its content and the
   WHOLE BROWSER VIEWPORT scrolls — header, copy and logo footer together — with
   the forward / decision control at the natural bottom. This is the SAFE default:
   it is exactly what renders if no page script runs, so nothing a participant
   needs can be hidden by a fit-check that fails silently (CLAUDE.md&#x27;s warning).

   THE OTHER TWO MODES DO NOT LIVE ON THIS RULE, on purpose:
     * MODE 2 (single-page fit) is progressive enhancement layered ON TOP of
       Mode 1 by the `.single-page-fit` class global.js adds — font + spacing
       only, never a ceiling. See THE SINGLE-PAGE FIT below.
     * MODE 3 (inner-card scroll) is the DORMANT opt-in `.inner-scroll` further
       down — it, and ONLY it, restores the max-height ceiling and the inner
       scroll region. The results page uses it; any page may re-enable it. */
:root {
    /* --card-margin — THE RESTING MARGIN (Julian, 2026-08-18). A PROPORTIONAL,
       viewport-scaled band that sits above AND below the card at rest, so the
       resting card looks CENTRED (equal top and bottom) even though it is
       top-ANCHORED. It is ONE token feeding two things — the resting floor below
       and the shell&#x27;s top offset (see .experimental-screen) — so the two cannot
       drift and the anchor point is a fraction of the viewport, not a fixed pixel
       count. dvh so it tracks the real visible height on mobile (a bare vh
       ignores the retracting URL bar); the vh here is the fallback for browsers
       without dvh, overridden below. ~6dvh reproduces the old 88vh resting card. */
    --card-margin: 6vh;
    /* --card-min — THE RESTING FLOOR, AND IT IS A FIXED FRAME, NOT A SHRINK-WRAP.
       = the viewport MINUS the two resting margins, so at rest the card fills the
       middle band exactly and its top margin equals its bottom margin (symmetric,
       reads as centred). Because it is a `min-height` (see .screen-card), a card
       whose content is SHORTER than this stays pinned at --card-min and NEVER
       hugs its content — the content fills or centres INSIDE the fixed frame — so
       two short pages with different amounts of content show the identical card
       with no jump between them. Only content TALLER than --card-min grows the
       card, DOWNWARD past the bottom margin, and the whole page scrolls while the
       anchored top stays put (Mode 1). There is NO max-height on the default card
       — see .screen-card. */
    --card-min: calc(100vh - 2 * var(--card-margin));
    /* --inner-scroll-max — MODE 3&#x27;S CEILING, equal to the resting floor. With the
       min and the max coinciding an `.inner-scroll` card (the results page) is a
       FIXED --card-min frame whose overflow scrolls INSIDE the card. Used ONLY by
       `.inner-scroll` (see `.inner-scroll .experimental-content`), never by the
       default card. */
    --inner-scroll-max: var(--card-min);
    /* The width a scroll region reserves for its scrollbar on EACH edge
       (`scrollbar-gutter: stable both-edges`). It must equal the
       ::-webkit-scrollbar width below; anything that needs to line up with the
       content INSIDE a scroll region reads it from here. */
    --scroll-gutter: 10px;
    /* --single-page-font-floor — MODE 2&#x27;S LEGIBILITY FLOOR. The smallest body
       font the single-page fit may shrink to before it GIVES UP and falls back
       to Mode 1 whole-window scroll. Tied to the base scale (base font is
       clamp(16px..19px)); ~15px is a narrow band down from it, still readable. */
    --single-page-font-floor: 15px;
}
.screen-card {
    width: 100%;
    max-width: min(94vw, 1200px);
    min-height: var(--card-min);
    margin-inline: auto;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
    padding: clamp(18px, 3vw, 32px) clamp(18px, 4.5vw, 48px);
    display: flex;
    flex-direction: column;
    gap: clamp(16px, 2.6vw, 26px);
    /* Flush-left is the default; the narrative family (below) opts into
       centring, and the card itself is never centre-aligned by default. */
    text-align: left;
    /* DO NOT add transform / filter / backdrop-filter / contain / zoom to this
       rule — nor to the single-page-fit scaling below. Any of them makes the
       card a containing block for position:fixed, which would trap the
       tab-monitor&#x27;s full-screen overlay inside the card. This is WHY Mode 2
       scales with font-size and spacing tokens and never with transform/zoom. */
}
@supports (height: 1dvh) {
    /* The dvh forms; --inner-scroll-max references --card-min, so it follows. */
    :root {
        --card-margin: 6dvh;
        --card-min: calc(100dvh - 2 * var(--card-margin));
    }
}

/* THE CONTENT REGION — MODE 1 (THE DEFAULT): PLAIN DOCUMENT FLOW, NO INNER
   SCROLL. The header strip and the button row are still flex siblings, but with
   no max-height on the card there is nothing to scroll INSIDE: the region grows
   with its content, the card grows with the region, and the WHOLE BROWSER
   VIEWPORT scrolls — so the forward / decision control sits at the natural
   bottom of the content and is reached by scrolling PAST it, never pinned beside
   it. That is the property this template wants everywhere now, for the reason it
   already wanted it on a phone: a pinned action on a screen where the choice is
   below the cut is the &quot;reach the action before seeing what you are agreeing to&quot;
   shape, which consent and the agreement page must never have.

   THE INNER-SCROLL MODEL IS NOT GONE — it is the DORMANT `.inner-scroll` opt-in
   below (Mode 3), which the results page uses and any page may re-enable. Its
   scroll region, its `min-height: 0` load-bearing line and all four affordance
   layers live there, scoped to `.inner-scroll .experimental-content`, with their
   reasoning preserved. On a Mode-1 page the region never overflows (the card
   grows instead), so global.js never sets the `.is-scrollable-*` classes and the
   fade/cue simply never fire — no script, no phantom shadow.

   `safe center` keeps a SHORT page&#x27;s content vertically centred in the region
   (the region fills the card&#x27;s --card-min floor); a tall page just flows from
   the top. Browsers without `safe` keep plain `center`, correct for them because
   a Mode-1 card grows rather than clipping. */
.experimental-content {
    /* NO `width: 100%` HERE, and that is deliberate. As a flex item of the card
       this region already stretches to the card&#x27;s content width; adding
       `width: 100%` FIXES that width, so the negative side margins below could
       only move the box LEFT instead of widening it symmetrically. Measured
       with it in place (1280px viewport): the region&#x27;s box sat 8px left of the
       card&#x27;s content box, which pushed the whole centred reading band off the
       card&#x27;s centre line — the instructions title read visibly left of centre
       (band centre 625 against a card centre of 632.5). */
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1 1 auto;
    justify-content: center;
    justify-content: safe center;
    /* The symmetric padding/negative-margin pair holds a :focus-visible ring&#x27;s
       gutter open without shifting anything (it nets to zero). Kept from the
       inner-scroll era because it costs nothing and keeps the band-centring math
       identical whether or not a page opts into inner scroll. */
    padding: 8px;
    margin: -8px;
    scroll-padding-block: 8px;
}

/* ===========================================================================
   MODE 3 — INNER-CARD SCROLL. THE DORMANT OPT-IN. (2026-08-18 scroll overhaul.)
   ---------------------------------------------------------------------------
   `.inner-scroll` on a `.screen-card` restores the OLD model: the card is capped
   at --inner-scroll-max and its MIDDLE region scrolls inside it while the header
   and the footer stay pinned. It is retained for ONE live user — the results
   page (outro/Results.html), whose round-payment detail is collapsed by default
   so the collapsed state fits one page and expanding it scrolls INSIDE the white
   card — and documented as a reusable opt-in any page can turn back on. The
   reasoning below is the reasoning that used to sit on the unconditional rule;
   it is preserved because it is still true wherever this mode is used.

   `min-height: 0` IS LOAD-BEARING. A flex child&#x27;s default min-height is `auto`,
   which refuses to shrink below its content — without this line the region
   silently never scrolls and the card grows past its max-height instead. This is
   the single most common way this pattern fails; do not remove it.

   The padding/margin pair is not decoration here either: `overflow-y: auto` also
   clips horizontally, and a :focus-visible ring is 3px + 2px offset, so without
   the gutter the focus outline on the first/last option card would be sliced off
   by the scroll edge. It is inherited from the default rule above (same value),
   so it does not need repeating. */
.screen-card.inner-scroll { max-height: var(--inner-scroll-max); }
.inner-scroll .experimental-content {
    min-height: 0;
    overflow-y: auto;

    /* SCROLL AFFORDANCE — FOUR LAYERS. Measured 2026-08-10: the background
       gradients alone (layer 2) were far too quiet to read as &quot;there is more
       below&quot;, and a background can only ever paint BEHIND the text, so a
       partially visible line was still sliced cleanly through the glyphs and
       read as a rendering bug rather than as something to scroll to.

       1. A STYLED, ALWAYS-VISIBLE SCROLLBAR (below). Overlay scrollbars fade
          out when idle and say nothing; an explicitly styled one is painted for
          as long as the region overflows and needs no script. `stable
          both-edges` reserves the gutter symmetrically, so centred copy stays
          centred and nothing shifts when a page starts scrolling.
       2. THESE GRADIENTS — the JS-free fallback. Two pairs: the `local` ones
          scroll WITH the content in the card colour, the `scroll` ones are
          fixed shadows at the edges. At the top of the scroll the local
          gradient covers the top shadow; scroll and it moves away, revealing
          it. So each shadow shows only while there is more content that way.
          Explicit rgba(255,255,255,0) rather than `transparent`, which some
          engines interpolate through black.
       3. A CONTENT FADE (the .is-scrollable-* rules below), applied as a MASK
          so it fades the text itself. It is driven by global.js, which knows
          the scroll position, so the LAST line is never faded — the fade means
          &quot;there is more&quot;, always.
       4. THE WIDE LOW PULSING V (the scroll-cue component further down). */
    scrollbar-gutter: stable both-edges;
    /* THE MASKING GRADIENTS MUST BE FULLY OPAQUE FOR AT LEAST THE SHADOW&#x27;S
       HEIGHT (16px). They are 30px tall and solid to 60% of that = 18px, then
       fade. With the earlier 30% stop they were solid for only 9px, so the
       lower half of a shadow bled through even on a page with nothing to
       scroll — a phantom band across a card that fits, which is worse than no
       affordance at all (measured on the lab gate and the instructions page,
       2026-08-11).
       NB the `/*` that opens this comment was once MISSING, so CSS error
       recovery swallowed everything to the end of the `background` declaration
       below — layer 2 was silently absent from every page. A comment that does
       not open is not a comment; it is a deleted rule. */
    background:
        linear-gradient(var(--card-bg) 60%, rgba(255, 255, 255, 0)) top / 100% 30px no-repeat local,
        linear-gradient(rgba(255, 255, 255, 0), var(--card-bg) 40%) bottom / 100% 30px no-repeat local,
        radial-gradient(farthest-side at 50% 0, rgba(16, 32, 52, .30), rgba(255, 255, 255, 0)) top / 100% 16px no-repeat scroll,
        radial-gradient(farthest-side at 50% 100%, rgba(16, 32, 52, .30), rgba(255, 255, 255, 0)) bottom / 100% 16px no-repeat scroll;
}

/* ===========================================================================
   MODE 2 — SINGLE-PAGE FIT. PROGRESSIVE ENHANCEMENT, DESKTOP, TWO PAGES.
   ---------------------------------------------------------------------------
   COMPONENT — single-page fit. INTENTION: fit all of a short-ish page&#x27;s content
   in ONE viewport with no scroll, by tightening spacing and reducing the body
   font within a narrow band — used on exactly the consent welcome page
   (before/welcome+consent.html) and the tab-monitor agreement
   (before/tab_monitor_agree.html), and only on desktop.

   A page opts in by marking its `.screen-card` `data-single-page`. global.js&#x27;s
   `initSinglePageFit` then MEASURES and, on a desktop only, adds
   `.single-page-fit` and sets `--single-page-font` to the largest body font
   (from the base scale DOWN TO --single-page-font-floor) at which the whole card
   fits one viewport. If it fits at or above the floor: one centred screen, no
   scroll. If even the floor will not fit, the JS GIVES UP — removes the class —
   and the page is plain Mode 1 whole-window scroll.

   SCALES WITH FONT-SIZE AND SPACING ONLY — never transform/zoom/filter, each of
   which would make the card a containing block and trap the tab-monitor overlay
   inside it (see the .screen-card warning). Dropping the card&#x27;s font shrinks
   every em-based pad/gap with it; this block tightens the few fixed px/vw rhythms
   on top of that. `font-size` is set from the JS-provided custom property so the
   value the fit chose is data, not a hard-coded step.

   THE DECISION CONTROLS ARE NEVER PINNED: accept / decline / acknowledge stay at
   the end of the content (the ordinary foot button row), so a participant cannot
   reach the choice without passing the reading, and cannot miss that there is
   more. Phones never run this (always Mode 1); with no JS the class is never
   added, so the SAFE Mode-1 default always shows through.
   Specimen in _static/global/html/template.html. */
.screen-card.single-page-fit {
    font-size: var(--single-page-font, 1rem);
    gap: clamp(10px, 1.6vw, 18px);
}
.screen-card.single-page-fit .experimental-header { gap: 8px; }
.screen-card.single-page-fit .experimental-content { gap: 10px; }
.screen-card.single-page-fit &gt; .button-row { padding-top: 14px; }
.screen-card.single-page-fit .panel { padding: clamp(10px, 1.8vw, 16px); }

/* Layer 1 — the scrollbar itself. WebKit/Blink ignores scrollbar-width when a
   ::-webkit-scrollbar rule exists, and painting one explicitly is what stops
   Chromium using an overlay bar that is invisible in a screenshot (and to a
   participant who never moves the wheel). */
/* BOTH scroll regions reserve the gutter symmetrically. The instructions page
   scrolls its own slide body (.instruction-wrapper), not .experimental-content,
   and without this it took the scrollbar out of its RIGHT side only — which
   shifts a centred reading band 5px left of the card&#x27;s centre line on a phone
   (measured 2026-08-11). */
.instruction-wrapper { scrollbar-gutter: stable both-edges; }

.experimental-content::-webkit-scrollbar,
.instruction-wrapper::-webkit-scrollbar { width: var(--scroll-gutter); }
.experimental-content::-webkit-scrollbar-track,
.instruction-wrapper::-webkit-scrollbar-track {
    background: var(--sunken);
    border-radius: 999px;
}
.experimental-content::-webkit-scrollbar-thumb,
.instruction-wrapper::-webkit-scrollbar-thumb {
    background: var(--line-strong);
    border: 2px solid var(--card-bg);
    border-radius: 999px;
}
.experimental-content::-webkit-scrollbar-thumb:hover,
.instruction-wrapper::-webkit-scrollbar-thumb:hover { background: var(--ink-mute); }

/* Firefox has no ::-webkit-scrollbar and needs the standard properties. They are
   scoped to it on purpose: Chromium supports BOTH, and when the standard ones
   are present it IGNORES the ::-webkit-* rules above and paints a thin OVERLAY
   bar that fades out when idle — measured 2026-08-10 as no visible bar at all,
   which is the affordance we are trying not to have. */
@supports not selector(::-webkit-scrollbar) {
    .experimental-content,
    .instruction-wrapper {
        scrollbar-width: thin;
        scrollbar-color: var(--line-strong) var(--sunken);
    }
}

/* Layer 3 — the content fade. A MASK, not a background: only a mask can fade
   the TEXT, and a half-faded line reads as &quot;continues below&quot; where a
   hard-cut one reads as broken. The classes come from global.js
   (`is-scrollable-up` / `is-scrollable-down`); with no JavaScript no class is
   ever set, no mask is applied, and layers 1-2 carry the affordance alone —
   the script only ever ADDS to a page that already works. */
:root { --scroll-fade: 46px; }
.experimental-content.is-scrollable-down,
.instruction-wrapper.is-scrollable-down {
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - var(--scroll-fade)), rgba(0, 0, 0, 0));
    mask-image: linear-gradient(to bottom, #000 calc(100% - var(--scroll-fade)), rgba(0, 0, 0, 0));
}
.experimental-content.is-scrollable-up,
.instruction-wrapper.is-scrollable-up {
    -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0), #000 var(--scroll-fade));
    mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0), #000 var(--scroll-fade));
}
.experimental-content.is-scrollable-up.is-scrollable-down,
.instruction-wrapper.is-scrollable-up.is-scrollable-down {
    -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0), #000 var(--scroll-fade),
                                        #000 calc(100% - var(--scroll-fade)), rgba(0, 0, 0, 0));
    mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0), #000 var(--scroll-fade),
                                #000 calc(100% - var(--scroll-fade)), rgba(0, 0, 0, 0));
}

/* Pinned regions: never shrink, never scroll away. EXACTLY THREE — the header
   strip, the forward action, and the logo footer (see THE LOGO FOOTER RULE
   below, which is what makes the third one correct rather than the ~90px tax it
   used to be). */
.experimental-header,
.screen-card &gt; .button-row,
.screen-card &gt; .logo-section {
    flex: 0 0 auto;
}

/* =============================================================================
   THE LOGO FOOTER RULE  (Julian, 2026-08-13, change_requests_round2 item 9)
   =============================================================================
   THE RULE, in one sentence: the logo footer sits at the BOTTOM OF THE WHITE
   CARD, BELOW the divider line that separates it from the content, and it is
   the SAME on every page that shows it.

   It is A RULE, not a per-page decision, and it is enforced HERE rather than by
   each template getting its markup right — because a per-page arrangement is
   exactly the kind of thing a new page copies from whichever page its author
   happened to open. Two guarantees:

     * `order: 999` puts the strip LAST among the card&#x27;s flex children whatever
       order the markup is in, so a template that includes it before the button
       row still renders it below the button row;
     * `margin-top: auto` pushes it to the card&#x27;s bottom edge when the content
       does not fill the card, so a one-sentence page (the lab gate) reads as
       copy with the marks along the foot rather than copy and marks clumped
       together in the middle.

   THE DIVIDER is `border-top` on `.logo-section` itself (see the logos section
   further down), so it travels with the strip and cannot be forgotten.

   WHAT A TEMPLATE MUST DO: include `_static/global/html/logo_section.html` as a
   DIRECT CHILD OF `.screen-card`. That is the whole contract, and the include
   says so at the top of itself.

   HISTORY, because this reverses an earlier decision and the earlier reasoning
   was sound at the time: the strip used to live inside `.experimental-content`
   on every page but Results, because as a PINNED sibling it reserved ~90px of
   every card and pushed the consent options below the fold at 1280x720. What
   changed is that it is no longer a reserved band ABOVE the fold — it is the
   last thing on the card, after the action, so a short page gets it for free and
   a long page pushes it down with everything else. Re-measured at three
   viewports by scripts/tests/render_check.py. If a future edit makes the strip taller,
   MEASURE AGAIN: a layout regression here produces no error and no red test.

   THE PRIORITY, and it decides future arguments rather than describing a past
   one (Julian, 2026-08-13): THE LOGO STRIP IS EXTRA, AND MUST NOT TAKE
   PRECEDENCE OVER IMPORTANT FEATURES. It is an institutional footer, not
   something a participant came here to read or act on, so ON A SHORT SCREEN IT
   GIVES WAY BEFORE PARTICIPANT-FACING CONTENT DOES — see the `max-height: 820px`
   block further down, which shrinks the marks to the phone size.

   SO WHEN VERTICAL SPACE IS SHORT AGAIN, THIS STRIP IS THE FIRST THING THAT
   YIELDS: shrink it (or, if it ever comes to it, drop it on that breakpoint)
   before tightening a control, and never before cutting copy a participant is
   agreeing to. That ordering is the rule; the pixel counts are just where it
   landed this time. What must NOT change to buy space is the strip&#x27;s PLACEMENT —
   the order, the bottom-edge push and the divider above are what Julian asked
   for and are not the flexible part. */
.screen-card &gt; .logo-section {
    order: 999;
    margin-top: auto;
}

.experimental-header {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* --- reading measure --------------------------------------------------------
   Running prose (titles + body copy) narrows to the reading measure and centres
   as a column inside the wider card. Controls, forms, tables and widgets are
   NOT in these selectors, so they keep the full card (band) width — never
   clamp a control to the reading measure. */
.header-title,
.header-text,
.section-title,
.section-header,
.section-text {
    width: 100%;
    max-width: var(--read-measure);
    margin-inline: auto;
}

/* COMPONENT — reading band. INTENTION: narrow running text to a centred measure
   inside the wide card, so lines stay legible while functional components still
   span the card. This component only sets the measure + centres the block; the
   opting-in FAMILY chooses the alignment (narrative centres, instructions
   justify). Apply with class=&quot;read-band&quot;. */
.read-band { width: 100%; max-width: var(--read-measure); margin-inline: auto; }

/* SINGLE SOURCE OF TRUTH for the page-title look. INTENTION: the narrative /
   welcome / consent page title (.header-title) and the instructions section
   title (.instruction-block &gt; h2) are the SAME visual element, so both draw
   their type from this ONE rule — edit the title look here and nowhere else.
   (Both are &lt;h2&gt;, so colour and letter-spacing come from the shared h1,h2,h3
   rule above; this rule only sets the size/line-height/weight.)
   ALIGNMENT IS A CONSTANT RULE, NOT A FAMILY CHOICE (change_requests item 8,
   Julian 2026-08-11): IF A PAGE HAS A TITLE, THE TITLE IS CENTRED — on every
   page, in every family. It used to be centred by .narrative-card only, so the
   narrative pages, the instruction step titles and the end-of-experiment
   heading disagreed with each other for no reason a participant could see.
   The centring therefore lives HERE, on the component, and the note that used
   to say the opposite is gone. Body copy alignment is still the family&#x27;s
   business (narrative centres, instructions justify, quiz stays left) — this
   is about the title only. Visible knock-on when this shipped: the Quiz,
   Results and demographics titles became centred too, which is the rule
   working. */
.header-title {
    margin: 0;
    font-size: clamp(23px, 2.4vw, 31px);
    line-height: 1.22;
    font-weight: 680;
    text-align: center;
}

.header-text {
    margin-block: 0;
    color: var(--ink-mute);
    font-size: 0.94em;
}

.section-header {
    margin-block: 24px 12px;
    font-size: clamp(18px, 1.5vw, 21px);
    color: var(--ink);
}

.section-title {
    margin-block: 24px 12px;
    font-size: clamp(18px, 1.5vw, 21px);
    font-weight: 650;
    color: var(--ink);
}

/* NOT JUSTIFIED. Justification belongs to the instructions family and to the
   reading band only (`instructions.css` justifies `.instruction-block &gt; p/ul/ol`
   itself); it was here as a global default, so a one- or two-line sentence on a
   narrative or task page — the lab gate&#x27;s single line, the task screen&#x27;s
   prompt — came out with stretched word spacing. Narrative pages centre this
   text (`.narrative-card` below); everything else inherits the card&#x27;s
   flush-left. */
.section-text {
    margin-block: 0;
}

/* An &quot;eyebrow&quot;: small, quiet, uppercase context line above a title. It lives
   inside .experimental-header, which spans the card and stays top-LEFT.
   ALIGNMENT: on a page whose content is held to a reading band, the eyebrow
   follows that band (see the family rules below) rather than the card&#x27;s padding
   edge. Julian, 2026-08-11: with the frame now a constant 1200px the eyebrow sat
   ~180px away from the copy it introduces and read as stranded in the margin.
   (NB the reference build leaves it at the card edge — its narrative cards are
   the same 1200px frame, so this is a deliberate departure, not a port.)
   On a FULL-WIDTH page — a task screen, a results table — there is no band to
   follow, so the eyebrow keeps the card edge, which is why this is scoped to
   the families that have one. */
.eyebrow {
    font-size: 0.74em;
    font-weight: 650;
    letter-spacing: .085em;
    text-transform: uppercase;
    color: var(--ink-mute);
}
/* Narrative family: the whole HEADER STRIP takes the band, so the eyebrow AND
   the title sit on the same left edge as the copy below them.
   Why the strip and not the eyebrow itself: `--read-measure` is `68ch`, and
   `ch` resolves against the ELEMENT&#x27;s own font — the eyebrow is 0.74em, so
   capping it at 68ch gave a band ~360px wide and pushed it further from the
   copy, not closer (measured 2026-08-11). The strip inherits the card&#x27;s font,
   so its 68ch is the same 68ch the body copy uses.
   The extra `--scroll-gutter` of width and matching padding line the strip up
   with the CONTENT region, which reserves that gutter for its scrollbar on both
   edges; without it the strip&#x27;s band would sit a gutter-width outside the copy&#x27;s. */
.narrative-card .experimental-header {
    width: 100%;
    max-width: calc(var(--read-measure) + 2 * var(--scroll-gutter));
    margin-inline: auto;
    padding-inline: var(--scroll-gutter);
}

/* COMPONENT — panel. INTENTION: a quiet grey card for secondary information
   (privacy statements, callouts, reminders), full width of its column by
   default. */
.panel {
    background: var(--sunken);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: clamp(14px, 2.4vw, 20px);
}

/* COMPONENT — hug panel (variant of .panel). INTENTION: a highlight panel that
   SHRINKS to fit its content and sits centred, instead of stretching to the band
   (a full-width grey block looks heavy behind a one-line reminder).
   `display:table` shrink-wraps the content; `margin-inline:auto` centres it
   regardless of the parent&#x27;s text-align. Opt in with class=&quot;panel panel--hug&quot;. */
.panel--hug { display: table; max-width: var(--read-measure); margin-inline: auto; }

/* COMPONENT — warning panel (variant of .panel). INTENTION: a panel that says
   SOMETHING MAY GO WRONG AND YOU MUST ACT, as opposed to the quiet grey .panel,
   which says &quot;here is some secondary information&quot;. The two are different
   intentions and so are two classes, not one class with a colour override.
   Opt in with class=&quot;panel panel--warning&quot; (composes with panel--hug).

   Its only user today is the non-SEPA bank warning on outro/Results.html —
   &quot;speak to the experimenter before leaving to ensure payment will be
   successful&quot; — which shipped in the grey panel and therefore looked like a
   footnote (Julian, 2026-08-13, change_requests_round2 item 4). It is the last
   chance to fix a payment that will otherwise fail, and it has to look like it.

   Colour comes from --danger, the same token the error panel and the warning
   modal use, so a study that retunes the palette retunes this too. The tint is
   a light wash rather than a solid fill: solid --danger behind body copy fails
   contrast at this text size, and the panel must stay READABLE, not just
   alarming. The left bar is what carries the alarm at a glance. */
.panel--warning {
    background: #fdeaec;
    border-color: var(--danger);
    box-shadow: inset 3px 0 0 var(--danger);
}

/* COMPONENT — elicitation box. INTENTION: the SHARED FRAME every elicitation
   sits in, so a slider, an allocation, a rating or any other ACTIVE input
   region looks the same and reads as &quot;here is where you answer&quot; — visual
   separation of the response from the surrounding prose, as a CONVENTION rather
   than styling local to one control. The next agent adding an elicitation drops
   the control inside `&lt;div class=&quot;elicitation&quot;&gt;…&lt;/div&gt;` and it is framed
   automatically; the control itself (e.g. .slider-elicit) carries only its own
   internal look.

   DISTINCT FROM .panel ON PURPOSE, and it must stay two classes not one. .panel
   is the quiet grey box for SECONDARY INFORMATION (a note, a reminder); this
   frames an ACTIVE INPUT the participant acts on. So it is the raised WHITE
   surface with a stronger border and a soft lift — it stands forward off the
   card as the thing to interact with, where the panel sits back into it. Do not
   collapse them by tinting a panel: the intention differs, so the class does.
   Specimen in _static/global/html/template.html (the slider elicitation is its
   first user). */
.elicitation {
    background: var(--card-bg);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
    padding: clamp(16px, 2.6vw, 22px);
}

.hint { color: var(--ink-mute); font-size: 0.86em; }

/* COMPONENT — template note. INTENTION: a muted italic aside addressed to the
   STUDY AUTHOR, not the participant — &quot;this is shipped example content,
   replace it&quot; (the Stag Hunt instructions use it). Ink from the tokens, never
   a hardcoded grey, so it follows a palette change like everything else. A
   real study should end up with no remaining users of this class.
   Specimen in _static/global/html/template.html. */
.template-note {
    font-size: 14px;
    color: var(--ink-mute);
    font-style: italic;
}

/* FAMILY — narrative card. INTENTION: narrative screens (welcome, consent, the
   agreement and part/block-start screens) CENTRE their script — the page title,
   the sentences and the panels are centred and held to the reading band — while
   the header strip stays full-width top-LEFT. Instructions are the JUSTIFIED
   family; quiz is the LEFT-aligned form family; task/results are unchanged.
   Opt in with class=&quot;screen-card narrative-card&quot;. */
.narrative-card .experimental-content { text-align: center; }
/* (The title&#x27;s centring is no longer here: it is the constant rule on
   .header-title itself — see item 8 above. The eyebrow above it stays left.) */
.narrative-card .section-text { max-width: var(--read-measure); margin-inline: auto; text-align: center; }
/* Option groups keep the uniform band width (see the mc-option component) and
   centre as a block; each option row stays left-aligned inside. */
.narrative-card .stacked-form { width: 100%; max-width: var(--read-measure); margin-inline: auto; text-align: left; }

/* --- reserved height (no-jump pattern) --------------------------------------
   For anything that appears or disappears while a page is on screen, reserve
   its box permanently and toggle .is-visible, so nothing below it shifts when
   it clears. Hide with `visibility` (space kept), NOT `display`/`hidden` (space
   collapses). Used live by the instructions Page counter (instructions.js
   toggles the counter&#x27;s visibility rather than removing it). */
.reserve-height { visibility: hidden; }
.reserve-height.is-visible { visibility: visible; }

/* --- submit veil ------------------------------------------------------------
   Opaque full-page cover dropped the instant a script auto-fills a form and
   submits it (e.g. the DEBUG skip-quiz control), so the participant never sees
   controls being set before navigation completes. Matches the page background
   so it reads as a plain loading frame.
   Painted ONLY by global.js&#x27;s submitFormBehindVeil() — the single shared
   implementation. Do not hand-roll another overlay in a page script; route the
   auto-fill through that helper instead. */
.submit-veil {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--page-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-mute);
    font-size: .95em;
}

/* --- buttons ----------------------------------------------------------------
   The primary forward button is horizontally centred and pushed to the FOOT of
   the card (margin-top: auto), so the card&#x27;s default height is filled: content
   sits up top, the action near the bottom. Scoped to the card&#x27;s OWN row, so a
   button-row nested inside a widget keeps its tight rhythm. */
.button-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding-top: 4px;
}

.screen-card &gt; .button-row { margin-top: auto; padding-top: 24px; }

/* COMPONENT — THE ROOM ENTRY GATE  (Julian, 2026-08-18)
   =============================================================================
   INTENTION: vertically centre the content on oTree&#x27;s room-entry interstitial
   (`_templates/room_welcome.html`, wired via `welcome_page` on settings.ROOMS),
   instead of foot-anchoring its one button the way every in-app page does.

   WHY THIS PAGE IS AN EXCEPTION, AND WHY IT IS *NOT* THE SAME EXCEPTION AS ANY
   OTHER. The default card layout (above) does two things a normal page wants:
   it holds the `--card-min` floor so the frame never jumps between screens, and
   it pushes the forward action to the FOOT (`.screen-card &gt; .button-row`,
   `margin-top: auto`) so content sits up top and the action sits near the
   bottom. That reads well when the card is FULL — a consent page, the quiz, the
   task. The room gate is the degenerate case: one line of copy and a Start
   button. Foot-anchoring the button there leaves the copy stranded at the top
   and the button alone at the bottom with a wide dead band between them
   (measured ~270px in the downstream study this mirrors). So the gate KEEPS the
   floor — visual consistency with every other screen is the whole reason not to
   just shrink the card — but CENTRES its header+content+button as a group within
   that floor rather than splitting them to the two edges. (The header is the
   study&#x27;s styled `Welcome` — eyebrow + title — added 2026-08-18; the group it
   centres is those three, top to bottom.)

   THIS IS ITS OWN CLASS ON PURPOSE. It does NOT reuse or extend `.narrative-card`
   (which only decides HORIZONTAL text treatment — the gate still composes that
   for its centred copy), nor any other page&#x27;s exception. One class silently
   governing two unrelated screens is exactly the trap: a future tweak aimed at
   some other short page would quietly move the FIRST screen every participant
   sees. `.room-gate` names one screen and one screen only; do not reach for it
   from anywhere else, and if another short page ever wants centring, give it its
   own class rather than sharing this one.

   HOW IT CENTRES, with the footer still at the foot. The card is a flex column.
   TWO auto margins, BOTH OWNED BY THIS BLOCK, share the free space equally: a
   `margin-top: auto` on `.experimental-header` (the FIRST element of the group)
   and a `margin-bottom: auto` on the button row. The result is F/2 above the
   header and F/2 between the button and the logo, so the header+content+button
   trio is centred in the space above the footer, and that same lower margin
   pushes the logo strip flush to the card&#x27;s bottom edge — the LOGO FOOTER RULE&#x27;s
   outcome (order 999, divider above, at the foot) is preserved; only the
   mechanism that pins it there changes. (The upper margin lived on
   `.experimental-content` until 2026-08-18, when the header was added above the
   copy; an auto margin on the content would now split the header off the top
   instead of centring the whole group, so it moved up to the header.)

   WHY THIS BLOCK PINS THE FOOTER ITSELF INSTEAD OF LEANING ON THE FOOTER RULE&#x27;S
   OWN `margin-top: auto`. Because that margin is NOT there on the screens that
   matter. The `@media (max-height: 820px)` block below zeroes
   `.logo-section`&#x27;s margin-top to buy back rhythm — and a 1280x720 laptop (the
   single most common participant display) and every phone match it. Had this
   block used the footer&#x27;s margin as the second centring margin, only ONE auto
   margin would survive on those screens, it would eat all the free space, and
   the copy would sit at the BOTTOM of the card instead of centred — green on a
   tall desktop, broken on the screen most participants actually arrive on. So
   this block sets `.logo-section`&#x27;s margin-top to 0 in ALL viewports and does
   its own pinning with the button&#x27;s bottom margin. Two margins, both here, no
   dependency on a rule a media query rewrites out from under it.

   For the two margins to have space to share, the content region must NOT grow
   (it defaults to `flex: 1 1 auto`, which would eat the free space first and
   leave the margins nothing) and the button must NOT foot-anchor (or it lands at
   the bottom, not under its copy). Both are overridden below. This page is
   always short by construction, so dropping the grow/scroll behaviour costs
   nothing here.

   NOTE ON ASSET LOADING — this is easy to get wrong. The gate links base.css
   ITSELF (see the template header), NOT via css_bundle.html, so this rule only
   reaches the page because it lives in base.css. Do not move `.room-gate` into a
   per-page stylesheet: the gate does not load those, and the class would
   silently do nothing, falling back to the plain foot-anchored card. And because
   the gate&#x27;s own &lt;link&gt; carries no `?v=` cache-buster (no page context for
   C.STATIC_VERSION), a change here is easy to miss in a version bump — verify by
   fetching the RENDERED page. Measured by scripts/tests/render_check.py leg AR. */
/* ZERO THE CARD&#x27;S FLEX GAP, and let explicit margins carry the header-&gt;copy and
   copy-&gt;button rhythm instead. This is not cosmetic — it is what makes the
   centring EXACT. The card&#x27;s `gap` is inserted BETWEEN flex items, so there is a
   gap between the button row and the logo but NONE above the header (it is the
   first child). That single unmirrored trailing gap rides the whole group up by
   half its size — measured as an 8px error at the 16px laptop gap and 12px at
   the 26px desktop gap, i.e. exactly gap/2, and it grows with the gap. With the
   gap at 0, the two auto margins are the only vertical space, so they frame the
   group symmetrically. (The header-&gt;copy spacing is the content&#x27;s own
   margin-top below, and the copy-&gt;button spacing is the button row&#x27;s
   padding-top, the same rhythm every page&#x27;s forward action already uses.) */
.room-gate.screen-card { gap: 0; }
/* THE UPPER HALF OF THE CENTRING lives on the HEADER, because the header is the
   FIRST element of the centred group (eyebrow + Welcome title, added 2026-08-18
   to restore the styled heading the .room-gate work had left off). It used to
   sit on `.experimental-content` back when the copy was the first child; with a
   header above the copy, an auto margin on the content would open a gap BETWEEN
   the header and the copy and strand the header at the top instead of centring
   the whole group. `.experimental-header` is already `flex: 0 0 auto` (it will
   not grow), so this margin is free to take the upper share of the slack. */
.room-gate .experimental-header { margin-top: auto; }
.room-gate .experimental-content {
    /* Hug the copy instead of ballooning to fill the card, so the free space
       survives for the two auto margins to centre the group. */
    flex: 0 0 auto;
    /* The base rule pairs `padding: 8px` with `margin: -8px` to hold a focus-ring
       gutter open inside the scroll region. This page never scrolls, so the
       gutter is pointless here — and its negative BOTTOM margin would pull the
       button up into the copy, overlapping the rhythm the button row&#x27;s
       padding-top is meant to set. Drop both — netting to zero horizontally, as
       the phone breakpoint already does. The TOP margin is now header-&gt;copy
       RHYTHM (not centring — the centring auto margin moved up to the header
       above): the card&#x27;s normal inter-block gap, so the space under the Welcome
       title matches the header-&gt;content spacing every other screen gets from
       that same gap. */
    padding: 0;
    margin: clamp(16px, 2.6vw, 26px) 0 0 0;
}
/* Un-foot-anchor the button (margin-top: 0) so it hugs directly under its copy —
   the padding-top from the base rule stays as ordinary rhythm; that 24px is
   spacing, not the dead band this fixes. `margin-bottom: auto` is the lower half
   of the centring AND what pins the logo strip to the foot (see the block header
   for why this block owns that pin rather than the footer rule). Higher
   specificity than `.screen-card &gt; .button-row`. */
.room-gate.screen-card &gt; .button-row { margin-top: 0; margin-bottom: auto; }
/* Take the footer&#x27;s own top margin out of the centring maths in EVERY viewport,
   so exactly two auto margins (both above) do the work. On short screens the
   media query already sets this to 0; here we also beat the tall-screen
   `.screen-card &gt; .logo-section { margin-top: auto }` (same specificity, this
   rule is later). The strip still lands at the foot — the button&#x27;s bottom margin
   puts it there. */
.room-gate .logo-section { margin-top: 0; }

.next-button,
button.next-button,
input.next-button {
    appearance: none;
    -webkit-appearance: none;
    font: inherit;
    font-weight: 620;
    font-size: 1em;
    line-height: 1;
    color: #fff;
    background: var(--accent);
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 0.85em 2em;
    cursor: pointer;
    margin: 0;
    text-align: center;
    text-decoration: none;
    transition: background-color .16s ease, transform .12s ease, box-shadow .16s ease;
    box-shadow: 0 1px 2px rgba(16, 32, 52, .12);
}

.next-button:hover { background: var(--accent-hover); box-shadow: var(--shadow-lift); }
.next-button:active { transform: translateY(1px); }

/* Secondary action (e.g. &quot;Back&quot; on the instruction pager). Same geometry as the
   primary so the pair sits evenly; quieter so the forward action leads. */
.next-button.ghost {
    background: transparent;
    color: var(--ink-soft);
    border-color: var(--line-strong);
    box-shadow: none;
}
.next-button.ghost:hover { background: var(--sunken); color: var(--ink); box-shadow: none; }

.next-button:disabled { opacity: .42; cursor: default; }
.next-button:disabled:hover { background: var(--accent); box-shadow: none; }
.next-button.ghost:disabled:hover { background: transparent; }

/* COMPONENT — exit-button. INTENTION: an IRREVERSIBLE way off a page, offered
   as the quieter of two options. Used by the entry screen-out page&#x27;s &quot;end the
   study and go back to Prolific&quot; link, where the action we actually want — go
   and switch device — has no control at all, and this one closes the door.
   Same geometry as the shared ghost button so it still reads as a real control.

   NB deliberately NOT .next-button, and NOT .next-button.ghost: global.js&#x27;s
   Enter handler clicks the first .next-button on the page, and an irreversible
   exit must never be one stray keystroke away. Same reasoning as
   .modal-dismiss-button below. It is an &lt;a href&gt;, so it also has to set the
   things a link does not inherit from a button (display, text-decoration). */
.exit-button {
    display: inline-block;
    font: inherit;
    font-weight: 620;
    font-size: 1em;
    line-height: 1;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 0.85em 2em;
    margin: 0;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: background-color .16s ease, border-color .16s ease, color .16s ease;
}

.exit-button:hover { background: var(--sunken); color: var(--ink); }

/* --- forms ------------------------------------------------------------------ */
form {
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* COMPONENT — stacked form. INTENTION: a column of labels and controls that
   fills its band, so a group of option cards reads as one block of equal-width
   rows rather than as ragged tags sized by their own text.
   `align-items: stretch` (the default, stated explicitly because it is
   load-bearing) is what makes that true: with `flex-start` every child
   shrink-wrapped, so on the consent page an option card came out roughly half
   the width of the privacy panel directly above it. The quiz family already
   overrode this to stretch (quiz.css), which is why quiz options looked right
   and consent options did not — one behaviour now, defined here. */
.stacked-form {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: stretch;
}

.stacked-form input[type=&quot;text&quot;] {
    width: 100%;
}

.radio-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-start;
}

input[type=&quot;text&quot;], input[type=&quot;number&quot;], select, textarea {
    font: inherit;
    padding: .7em .85em;
    box-sizing: border-box;
    color: var(--ink);
    background: var(--card-bg);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    transition: border-color .15s ease, box-shadow .15s ease;
}
input[type=&quot;text&quot;]:focus, input[type=&quot;number&quot;]:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
    outline: none;
}

/* Validation errors. .otree-form-errors is oTree&#x27;s own banner — style it too, or
   an unstyled framework box drops into an otherwise designed page. */
.errors, .otree-form-errors {
    color: var(--danger);
    background: #fdeff1;
    border: 1px solid #f3c6cd;
    border-radius: var(--r-md);
    padding: .8em 1em;
    margin: 0;
    font-size: .94em;
}

/* --- range sliders: touch-sized, one consistent look ------------------------
   Generous 30px thumb so the control is comfortably draggable with a thumb on a
   phone. Hand-rolled so it looks the same on every browser. */
input[type=&quot;range&quot;] {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    margin: 0;
    background: transparent;
    cursor: grab;
    touch-action: pan-y;
}
input[type=&quot;range&quot;]:active { cursor: grabbing; }
input[type=&quot;range&quot;]::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 999px;
    background: var(--line-strong);
}
input[type=&quot;range&quot;]::-moz-range-track {
    height: 6px;
    border-radius: 999px;
    background: var(--line-strong);
}
input[type=&quot;range&quot;]::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 30px;
    height: 30px;
    margin-top: -12px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--accent);
    box-shadow: 0 2px 6px rgba(16, 32, 52, 0.22);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
}
input[type=&quot;range&quot;]::-moz-range-thumb {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--accent);
    box-shadow: 0 2px 6px rgba(16, 32, 52, 0.22);
}
input[type=&quot;range&quot;]:hover::-webkit-slider-thumb { transform: scale(1.06); }
input[type=&quot;range&quot;]:active::-webkit-slider-thumb { transform: scale(1.12); }

/* --- focus: always visible, never removed (accessibility) ------------------- */
:focus-visible {
    outline: 3px solid var(--accent-ring);
    outline-offset: 2px;
    border-radius: 4px;
}

/* --- ONE focus indicator per option card, and it is the CARD ------------------
   (improvement_suggestions item 2, Julian 2026-08-12: &quot;drop the INNER one&quot;.)

   An option card is one control as far as a participant is concerned, so it
   gets ONE ring. Two rules used to fire on the same keystroke — the card&#x27;s
   `:focus-within` treatment (border + 3px ring, further down this file) and the
   global `:focus-visible` outline on the radio INSIDE it — which drew a ring
   inside a ring. The card ring is the more legible of the two, especially at
   phone size, so the inner outline is suppressed here and the card ring is the
   single indicator.

   THIS IS A SUPPRESSION WITH A REPLACEMENT, NOT A REMOVAL. Never delete a focus
   outline without one: the rule immediately below (.mc-option:focus-within) is
   what a keyboard user actually sees, it is asserted by
   scripts/tests/render_check.py&#x27;s focus leg, and if that rule is ever dropped this one
   must go with it.

   THE BOOTSTRAP RESET STAYS. oTree loads bootstrap5 before this file, and it
   ships `.form-check-input:focus { outline: 0; box-shadow: 0 0 0 .25rem
   rgba(13,110,253,.25) }`. The outline part no longer matters (we want none
   anyway), but the box-shadow does: without the reset a focused radio wears
   Bootstrap&#x27;s #0d6efd glow, which is neither of this design&#x27;s colours and
   reintroduces the doubled look it was just rid of. The `:checked` inset dot is
   more specific and is untouched. */
.form-check-input:focus-visible,
.mc-option input:focus-visible,
.form-check input:focus-visible {
    outline: none;
}
/* Scoped to Bootstrap&#x27;s own class ONLY, deliberately: `.mc-option input:focus`
   would sit at the same specificity as the `:checked` inset-dot rule below and
   is one reorder away from erasing the selected dot of a focused option. */
.form-check-input:focus { box-shadow: none; }

/* Testing-only skip buttons (rendered only when settings.DEBUG). Deliberately
   muted/dashed so they read as tooling, not part of the experiment UI. */
.debug-tools {
    text-align: center;
}

.skip-button {
    display: inline-block;
    border: 1px dashed var(--ink-mute);
    background: transparent;
    color: var(--ink-mute);
    padding: 8px 16px;
    font-size: 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: color 0.3s ease, border-color 0.3s ease;
}

.skip-button:hover {
    color: var(--ink-soft);
    border-color: var(--ink-soft);
}

/* --- logos: quiet, at the foot of the card ----------------------------------
   Sizing lives HERE, not as inline height attributes on the &lt;img&gt; tags in
   logo_section.html — an inline style beats any stylesheet rule, so a logo sized
   in the markup cannot be re-tuned from the design system. */
.logo-section { margin-top: 4px; padding-top: 18px; border-top: 1px solid var(--line); }
/* WRAPS, and no image may exceed the row. The marks are sized by HEIGHT, so
   their widths follow their aspect ratios: at 375px the two shipped logos came
   to 221px + 108px + gap = 347px in a ~333px column, which overflowed the card&#x27;s
   scroll region SIDEWAYS and cost ~15px of it to a horizontal scrollbar
   (measured 2026-08-11). Wrapping stacks them instead; `max-width: 100%` means a
   single wide mark shrinks rather than overflowing. */
.logo-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 14px 26px;
}

/* COMPONENT — THE LOGO BOX. INTENTION: any institution&#x27;s mark, of ANY aspect
   ratio, lands in the SAME bounding box, undistorted and uncropped.
   ============================================================================
   THE BUG THIS REPLACES (Julian, 2026-08-15). These marks used to be sized by
   HEIGHT ALONE (`height: 40px; width: auto`), which is only a box if every
   study ships the shape we do. Width then follows the aspect ratio, so:
     * a wide banner renders 276px across and a SQUARE mark 40px across — the
       same &quot;size&quot; by one measure and wildly different visual weight;
     * an EXTREME banner overshoots the row, hits `max-width` and is scaled
       down by WIDTH — so its height silently drops below the 40px everything
       else is aligned to, and the strip looks broken rather than tidy.
   We had just made the marks swappable by filename (see logo_section.html);
   that is half a promise if dropping in a differently-shaped file wrecks the
   strip.

   THE FIX: constrain BOTH dimensions and let the image choose which one binds.
   `height/width: auto` plus `max-height`/`max-width` is the only combination
   that fits a replaced element inside a box while preserving its ratio — the
   browser scales by whichever limit binds first. `object-fit: contain` cannot
   fire while both are auto and is here as a GUARD: if a future edit ever sets
   a fixed width or height, the mark still fits rather than stretching.

   THE BOX IS DERIVED FROM THE SHIPPED MARKS, so adopting it changes nothing
   about how this study looks (measured 2026-08-15):
       university_logo.jpg  1360x197 (6.90:1) -&gt; 276.1px wide at 40px high
       lab_logo.jpg          589x175 (3.37:1) -&gt; 134.6px wide at 40px high
   280px clears the widest by 4px, so both shipped marks render exactly as
   before and only foreign shapes are affected. The box keeps ONE ratio (7:1)
   at every breakpoint, so a mark that fits on a laptop fits on a phone.

   WHAT THE BOX DOES NOT DO, stated so nobody expects it: a square mark still
   occupies 40x40 inside a 280x40 box. Equalising the visual WEIGHT of a square
   and a banner would require cropping or distorting one of them, which is
   exactly what `contain` exists to prevent. What is guaranteed is that every
   mark FITS, keeps its shape, and never exceeds the 40px height the row aligns
   on.

   `min(..., 100%)` KEEPS THE ORIGINAL OVERFLOW GUARD. The 100% term is not
   redundant with the box: on a column narrower than the box (a 320px phone), it
   is what stops a mark widening the card. Removing it re-opens the measured
   2026-08-11 sideways-overflow bug described above the row. */
:root {
    --logo-box-h: 40px;
    --logo-box-w: 280px;          /* 7:1 — see THE BOX IS DERIVED, above */
    --welcome-logo-box-h: 44px;
    --welcome-logo-box-w: 308px;  /* the same 7:1 box at the header&#x27;s height */
}
.logo-row img {
    height: auto;
    width: auto;
    max-height: var(--logo-box-h);
    max-width: min(var(--logo-box-w), 100%);
    object-fit: contain;
    opacity: .62;
}

/* The welcome header&#x27;s inline lab mark (lab gate page). The mark itself is
   institution-neutral by filename and alt text — see logo_section.html.
   IT WRAPS, for the same reason the footer row does: the title and the mark sit
   on one flex line, and a foreign banner mark at the box&#x27;s full width would
   otherwise push the row sideways out of the card on a phone. Wrapping drops
   the mark under the title instead. Shipped marks never reach that point (the
   pair measures ~275px in a ~333px column at 375px), so nothing moves today. */
.welcome-header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
}
.welcome-header-row img {
    height: auto;
    width: auto;
    max-height: var(--welcome-logo-box-h);
    max-width: min(var(--welcome-logo-box-w), 100%);
    object-fit: contain;
}
/* The title INSIDE this row sizes to its words. It is an .header-title, which
   carries `width: 100%; max-width: var(--read-measure); margin-inline: auto` so
   that a page title holds the reading band — correct for a title that owns its
   line, wrong for one paired with a logo: it claimed the whole measure and shoved
   the mark to the far edge of the card, so &quot;Welcome to&quot; and the lab mark read
   as two unrelated things. */
.welcome-header-row .header-title { width: auto; max-width: none; margin-inline: 0; }

/* --- responsive: phone breakpoint -------------------------------------------
   A PHONE SCROLLS THE PAGE, NOT A BOX INSIDE THE CARD (improvement_suggestions
   item 1, Julian 2026-08-12). Below 520px the card-scroll model is switched off
   completely: the card&#x27;s height cap comes off, both scroll regions go back to
   normal flow, and the browser&#x27;s own scrollbar takes over. The consequences are
   the point, not side effects:

     * NEXT COMES AFTER THE CONTENT, in document order and on screen, so it
       cannot be reached without passing the options above it. On the consent
       page at 375x667 the choice was 125px below the fold of a pinned layout,
       which is the one shape this page must not have.
     * The page scrolls the way a phone user expects, with the system scrollbar
       and momentum, instead of a nested region with its own bar.
     * The scroll AFFORDANCES (fade, edge shadow, pulsing V) all disappear here
       by construction: they are bound to a region that overflows, and nothing
       overflows any more. That is correct — they exist to say &quot;this box has
       more inside it&quot;, and on a phone there is no box, just a page.

   THE GUTTER COUPLING, easy to miss: `scrollbar-gutter: stable both-edges` only
   reserves space on a SCROLL CONTAINER, so turning overflow off also removes
   the gutters the header strips were offset by. The eyebrow rules for the
   narrative and instructions families subtract those same gutters, so both must
   be zeroed here or the eyebrow ends up one or two gutters right of the copy it
   introduces (measured by the eyebrow leg in scripts/tests/render_check.py, which is
   what catches it).

   The card KEEPS its min-height, so a one-line page still fills the screen
   rather than collapsing to a stub. */
@media (max-width: 520px) {
    .button-row { justify-content: stretch; }
    .button-row .next-button { flex: 1; text-align: center; }
    /* THE BOX SHRINKS AS A BOX, keeping its 7:1 ratio (32px x 224px), so a
       mark that fits on a laptop fits here too. Retuning the token rather
       than the img rule keeps ONE definition of the box — see THE LOGO BOX.
       224px is what the widest shipped mark needs at 32px (220.9px). */
    :root { --logo-box-h: 32px; --logo-box-w: 224px; }
    .logo-row { gap: 18px; }

    /* THE INNER-SCROLL OPT-IN LETS GO ON A PHONE. A Mode-1 card already has no
       ceiling and no inner scroll, so these only affect a `.inner-scroll` page
       (the results page): on a phone it drops the cap and scrolls the PAGE like
       everything else, rather than trapping the receipt in a box inside the card.
       `.inner-scroll …` is needed on both because the opt-in rules out-rank the
       bare-class defaults on specificity (a media query adds none). The
       affordance background is cleared with it, or its local gradients would
       paint phantom bands once the region no longer scrolls. */
    .inner-scroll.screen-card { max-height: none; }
    .inner-scroll .experimental-content {
        overflow: visible;
        background: none;
        scrollbar-gutter: auto;
    }
    /* The card top is already anchored (base `.experimental-screen`,
       align-items: flex-start), so a phone card that exceeds the viewport grows
       downward and the page scrolls — no per-breakpoint alignment override is
       needed any more. */
    .experimental-content {
        /* the padding/negative-margin pair held a focus-ring gutter open inside
           the (now absent) inner scroller; with nothing clipping it only adds
           width, so drop it on a phone. */
        padding: 0;
        margin: 0;
    }
    /* No scroll container, no reserved gutter — so the header strip must not
       offset itself by one any more (see THE GUTTER COUPLING above).
       The INSTRUCTIONS page&#x27;s twin of this pair lives in instructions.css, and
       has to: that file loads after this one, so its `.instruction-wrapper`
       overflow rule would otherwise win over anything written here (a media
       query adds no specificity — only order decides). */
    .narrative-card .experimental-header {
        max-width: 100%;
        padding-inline: 0;
    }
}

/* --- SHORT VIEWPORTS: tighten the rhythm, not the content -------------------
   Every value in the card&#x27;s vertical rhythm is driven by vw (3vw padding, 2.6vw
   gaps), so a WIDE BUT SHORT screen — a 1280x720 laptop, the single most common
   participant display — gets a desktop&#x27;s generous spacing inside a card that is
   only 634px tall. Measured 2026-08-10: on that screen the consent options sat
   entirely below the fold, so a participant could reach Next without ever seeing
   the choice they were consenting to.

   ITS ROLE UNDER THE THREE-MODE MODEL (2026-08-18): this block is NO LONGER what
   clears the consent fold — consent and the agreement are Mode 2 single-page fit
   on a desktop, which fits the whole choice in one viewport by tightening
   font+spacing itself, and on a phone / on a Mode-1 fallback the choice is
   reached by scrolling the page (bypass-proof, never pinned). What survives is
   this block&#x27;s ORIGINAL, broader job: on any SHORT screen it tightens the
   card&#x27;s vw-driven rhythm so a Mode-1 page needs less scrolling and a short page
   frames its content better. It is general Mode-1 short-screen tightening now,
   not a fold-clearing patch for a capped scroller — the capped scroller is the
   dormant `.inner-scroll` opt-in above.

   This block buys back ~60px of visible content on a 720px-tall screen by
   tightening spacing ONLY — no font size, no copy, no component changes, so
   nothing about how the page reads changes. Keyed on height, so a tall desktop
   is untouched. */
@media (max-height: 820px) {
    .screen-card {
        padding: 18px clamp(18px, 4.5vw, 48px);
        gap: 16px;
    }
    .screen-card &gt; .button-row { padding-top: 14px; }
    .experimental-header { gap: 8px; }
    .experimental-content { gap: 12px; }
    .panel { padding: 14px 16px; }
    .logo-section { margin-top: 0; padding-top: 8px; }

    /* THE CONSENT CHOICE MUST CLEAR THE FOLD WHOLE — BOTH OPTIONS, NOT ONE.
       (Julian, 2026-08-13.) Measured at 1280x720 before this block: the DECLINE
       option ran 484..550 while the scroll region ended at 514, so exactly half
       of it (30px of 66px) was visible and a participant saw a full &quot;I consent&quot;
       card above a sliced one. The fold falling BETWEEN two options is worse
       than it falling below both: it reads as a complete list.

       WHY IT REGRESSED, and why the fix is here rather than there: THE LOGO
       FOOTER RULE (above) pins the strip as a card-level band, which is what
       Julian asked for and is not in question — this block pays for it out of
       SPACING instead, the same trade base.css already makes for the card and
       results.css makes for the payment summary. Nothing about the copy, the
       font sizes or the components changes.

       THE SELECTOR IS EVERY `.stacked-form` OPTION ROW, AND THAT IS THE RULE,
       NOT A LEAK (Julian, 2026-08-14): on a short viewport, option rows
       tighten to this rhythm on EVERY page that stacks them — consent, the
       quiz, demographics, and whatever a study adds. One component, one rule,
       everywhere: a component that tightens on short viewports on one page
       but not another is exactly the mixing-and-matching THE LOGO FOOTER RULE
       exists to prevent, wearing a different class.

       AN EARLIER SCOPING INTENT WAS ABANDONED HERE, ON PURPOSE — recorded so
       it cannot read as an oversight. When this block landed (2026-08-13) its
       comment claimed it was &quot;the consent group only&quot;, on the reasoning that
       one page&#x27;s shortfall must not silently retune every choice in the
       study — but the quiz and demographics stack their options in
       `.stacked-form` directly (no &quot;different wrapper&quot; ever existed), so the
       rule reached them from day one. The discrepancy surfaced through a
       geometry-baseline diff, not by design; measured and screenshotted on
       both pages, the shared rhythm was judged neutral-to-better (rows stay
       over the 44px touch floor that `min-height` guarantees, nothing
       cramped, more content above the fold), and Julian RATIFIED the shipped
       behaviour rather than restoring the scope. See the 2026-08-14 entry in
       DECISIONS.md. Do not re-scope this to one page without a new decision.

       THE TOUCH TARGET SURVIVES, which is the constraint that decides how far
       this can go: .85em -&gt; .5em block padding leaves each row 52px tall,
       comfortably over the 44px Apple/WCAG minimum that `min-height` guarantees
       anyway.

       WHAT IS LEFT, MEASURED (2026-08-13) — because the next person to trip
       this will be adding a sentence to the consent copy, not reading CSS:

         headroom below the last option today ............  7px @ 1280x720
                                                          182px @ 1512x1200
                                                          111px @ 375x667
         option rows to the 44px touch floor ............. +16px  (the floor;
                                                    below it min-height wins and
